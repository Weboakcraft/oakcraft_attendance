<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<script>/* apply saved theme early to avoid flash */(function(){try{var t=localStorage.getItem('oc_theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<title>OakCraft Attendance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f1420'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23e8b34b' font-family='Arial' font-weight='bold'>O</text></svg>">
<!-- Google Sign-In is NOT loaded up-front any more. An employee who is already
     signed in never needs it, so the app opens without waiting for it at all.
     ocLoadGsi() injects it on demand, only on the login screen. -->
<link rel="preconnect" href="https://accounts.google.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="OakCraft">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ============ OAKCRAFT ATTENDANCE — PREMIUM UI ============ */
:root{
  color-scheme: light;
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f9f9f7;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#6b6a64;   /* was #898781 - only 3.3:1, failed contrast */
  --line:#e1e0d9; --hairline:rgba(11,11,11,.08);
  --brand:#0f1420; --brand2:#1c2536; --gold:#e8b34b; --gold2:#c9962f;
  --blue:#2a78d6; --aqua:#1baf7a; --yellow:#eda100; --red:#e34948; --violet:#4a3aa7; --orange:#eb6834;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --goodtext:#006300;
  --shadow:0 1px 2px rgba(15,20,32,.05),0 8px 24px -12px rgba(15,20,32,.18);
  --shadow-lg:0 24px 60px -20px rgba(15,20,32,.35);
  --r:16px; --r-sm:10px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
/* ===== DARK THEME (toggled via data-theme="dark" on <html>) ===== */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#161615;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --hairline:rgba(255,255,255,.10);
  --blue:#3987e5; --aqua:#199e70; --yellow:#c98500; --red:#e66767; --violet:#9085e9; --orange:#d95926;
  --goodtext:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,120,214,.15)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
h1,h2,h3{letter-spacing:-.02em}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 70% -10%,#24314d 0%,#0f1420 55%,#0a0e17 100%);z-index:100;padding:20px}
.login-card{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(18px);border-radius:24px;padding:44px 36px;text-align:center;box-shadow:var(--shadow-lg);animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo-mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;font-weight:800;color:#0f1420;box-shadow:0 12px 30px -8px rgba(232,179,75,.5)}
.login-card h1{color:#fff;font-size:23px;margin-bottom:6px}
.login-card p{color:rgba(255,255,255,.55);font-size:13.5px;margin-bottom:28px}
#gbtn{display:flex;justify-content:center;min-height:44px}
.login-foot{margin-top:26px;color:rgba(255,255,255,.35);font-size:11.5px}
.login-err{margin-top:16px;color:#ffb4b4;font-size:13px;background:rgba(227,73,72,.12);border:1px solid rgba(227,73,72,.3);border-radius:10px;padding:10px;display:none}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;min-height:100dvh}
.shell{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{width:236px;background:linear-gradient(180deg,var(--brand) 0%,#0b0f19 100%);color:#fff;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:22px 14px calc(16px + var(--sab));z-index:40}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.side-brand .logo-mark{width:38px;height:38px;border-radius:11px;margin:0;font-size:19px}
.side-brand b{font-size:15.5px;letter-spacing:.01em}
.side-brand span{display:block;font-size:10.5px;color:rgba(255,255,255,.45);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.nav{flex:1;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;padding:10.5px 12px;border-radius:11px;color:rgba(255,255,255,.62);font-size:13.5px;font-weight:600;text-align:left;transition:all .15s;width:100%}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:linear-gradient(90deg,rgba(232,179,75,.18),rgba(232,179,75,.06));color:var(--gold)}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.side-user{display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.side-user .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .rl{font-size:11px;color:rgba(255,255,255,.45)}
.side-user button{color:rgba(255,255,255,.5);padding:6px}
.side-user button:hover{color:var(--red)}.theme-toggle:hover{color:var(--gold)!important}.theme-toggle .ic-sun{display:none}.theme-toggle .ic-moon{display:block}:root[data-theme="dark"] .theme-toggle .ic-sun{display:block}:root[data-theme="dark"] .theme-toggle .ic-moon{display:none}

.main{flex:1;min-width:0;margin-left:236px;padding:26px 30px calc(30px + var(--sab));max-width:1280px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h2{font-size:22px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- COMPONENTS ---------- */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;position:relative;overflow:hidden}
.tile .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.tile .k .dot{width:9px;height:9px;border-radius:3px;flex:none}
.tile .v{font-size:30px;font-weight:750;margin-top:8px;letter-spacing:-.03em}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:11px;font-weight:650;font-size:13.5px;transition:all .15s;border:1px solid transparent}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{background:var(--brand2);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#151a26}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-o{border-color:var(--line);color:var(--ink2);background:var(--surface)}
.btn-o:hover{border-color:var(--muted);color:var(--ink)}
.btn-danger{background:var(--crit);color:#fff}
.btn-good{background:var(--good);color:#fff}
.btn-good:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;min-height:36px}
/* icon-only actions need a real touch target - approve/reject used to be 28px */
.btn-ic{min-width:44px;min-height:44px;padding:0 10px;font-size:16px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-present{background:rgba(12,163,12,.12);color:var(--goodtext)}
.c-working{background:rgba(42,120,214,.12);color:var(--blue)}
.c-half{background:rgba(250,178,25,.15);color:#9a6b00}
.c-absent{background:rgba(208,59,59,.11);color:var(--crit)}
.c-leave{background:rgba(74,58,167,.11);color:var(--violet)}
.c-off{background:rgba(137,135,129,.14);color:var(--ink2)}
.c-late{background:rgba(236,131,90,.14);color:#b4522b}
.c-pending{background:rgba(250,178,25,.15);color:#9a6b00}
.c-approved{background:rgba(12,163,12,.12);color:var(--goodtext)}
.c-rejected{background:rgba(208,59,59,.11);color:var(--crit)}
:root[data-theme="dark"] .c-half,:root[data-theme="dark"] .c-pending{color:#fab219}:root[data-theme="dark"] .c-late{color:#ec835a}
.tbl-wrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-bottom:1px solid var(--hairline);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface2)}
td .who{display:flex;align-items:center;gap:9px}
td .who .avatar{width:30px;height:30px;font-size:12px}
td .who .em{font-size:11.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.month-in{width:auto}
.searchbox{max-width:230px}

/* ---------- PUNCH VIEW ---------- */
.punch-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.cam-card{position:relative;overflow:hidden;padding:0;background:#0b0f19}
.cam-stage{position:relative;aspect-ratio:4/3.4;display:flex;align-items:center;justify-content:center;background:#0b0f19}
#camVideo,#camCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#camCanvas{display:none}
.cam-off{color:rgba(255,255,255,.5);text-align:center;font-size:13.5px;padding:20px}
.cam-off .ic{font-size:40px;display:block;margin-bottom:10px}
.cam-bar{display:flex;gap:10px;padding:14px;background:rgba(10,14,23,.92);align-items:center;justify-content:center;flex-wrap:wrap}
.gps-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);background:var(--surface2);border:1px solid var(--hairline);border-radius:11px;padding:10px 13px;margin-top:12px}
.gps-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.gps-dot.ok{background:var(--good);box-shadow:0 0 0 4px rgba(12,163,12,.15);animation:pulse 1.8s infinite}
.gps-dot.err{background:var(--crit)}
.gps-dot.warn{background:var(--warn);box-shadow:0 0 0 4px rgba(250,178,25,.15)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(12,163,12,.18)}50%{box-shadow:0 0 0 7px rgba(12,163,12,.05)}}
.clock{font-size:42px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:16px;color:var(--muted);font-weight:600}
.punch-big{width:100%;padding:17px;border-radius:15px;font-size:16.5px;font-weight:750;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.timeline{margin-top:16px}
.timeline .ti{display:flex;gap:12px;padding:9px 0;align-items:center;border-bottom:1px dashed var(--line)}
.timeline .ti:last-child{border:none}
.ti .tdot{width:11px;height:11px;border-radius:50%;flex:none}
.ti .tt{font-weight:700;font-variant-numeric:tabular-nums}
.ti .ty{font-size:12px;color:var(--muted)}
.ti img{width:34px;height:34px;border-radius:8px;object-fit:cover;margin-left:auto;border:1px solid var(--line)}

/* ---------- CHARTS ---------- */
.chart-card h3, .card h3{font-size:14.5px;margin-bottom:2px}
.chart-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar-tip{position:fixed;pointer-events:none;background:var(--brand);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;box-shadow:var(--shadow-lg);z-index:90;display:none;white-space:pre-line;line-height:1.5}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-size:26px}
.donut-center span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* ---------- MODAL / TOAST ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,23,.55);backdrop-filter:blur(4px);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:26px;animation:rise .25s ease}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:10px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--sab));background:var(--brand);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:95;display:none;max-width:90vw;text-align:center}
.toast.err{background:var(--crit)}
.toast.ok{background:var(--good)}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-view{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 20px;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* payslip print */
#payslipArea{display:none}
@media print{
  body *{visibility:hidden} #payslipArea,#payslipArea *{visibility:visible}
  #payslipArea{display:block;position:absolute;inset:0;padding:30px}
}

/* My Salary: breakdown table and tiles stack on a phone instead of clipping */
.salary-tbl{min-width:0;font-size:13.5px}
.salary-tbl td{white-space:normal;padding:9px 6px}
.salary-tbl td:first-child{padding-left:0}
.salary-tbl td:last-child{padding-right:0;white-space:nowrap}

/* "More" sheet on the phone: the extra screens as a plain list. The icons used
   to render at the SVG default of 300x150 because nothing sized them. */
.more-list{display:grid;gap:10px}
.more-list .btn{justify-content:flex-start;gap:12px;min-height:52px;font-size:15px}
.more-list .btn svg{width:20px;height:20px;flex:none}

/* ---------- MOBILE ---------- */
.bottom-nav{display:none}
.mob-head{display:none}
@media (max-width: 960px){
  .sidebar{display:none}
  .mob-head{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 10px;background:var(--brand);color:#fff}
  .mob-head .avatar{width:34px;height:34px;font-size:13px}
  .mob-head .mh-who{flex:1;min-width:0}
  .mob-head .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mob-head .rl{font-size:11px;color:rgba(255,255,255,.55)}
  .mob-head button{color:rgba(255,255,255,.7);min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px}
  .mob-head button:active{background:rgba(255,255,255,.1)}
  .main{margin-left:0;padding:16px 14px calc(88px + var(--sab))}
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}
  .punch-wrap{grid-template-columns:1fr}
  .topbar h2{font-size:19px}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--brand);padding:8px 6px calc(8px + var(--sab));z-index:40;justify-content:space-around;border-top:1px solid rgba(255,255,255,.08)}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.55);font-size:10px;font-weight:650;padding:5px 9px;border-radius:10px;flex:1;max-width:88px}
  .bottom-nav button svg{width:21px;height:21px}
  .bottom-nav button.active{color:var(--gold)}
}
@media (max-width: 520px){ .g4,.g3,.g2{grid-template-columns:1fr 1fr} .tile .v{font-size:24px} }
/* after the generic phone grid rules on purpose, so these win */
@media (max-width: 700px){ .grid.salary-grid{grid-template-columns:1fr} .grid.salary-tiles{grid-template-columns:1fr} }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo-mark">O</div>
    <h1>OakCraft Attendance</h1>
    <p>Punch in, reports, leave &amp; payroll — all in one place.<br>Sign in with your company Google account.</p>
    <div id="gbtn"></div>
    <div class="login-err" id="loginErr"></div>
    <div class="login-foot">OakCraft · HR &amp; Payroll Automation · Internal Use Only</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
<div class="mob-head" id="mobHead">
  <div class="avatar" id="mhAvatar"></div>

const CONFIG = {

function ocParseHM(v){
  if(v === null || v === undefined || v === '') return null;
  if(v instanceof Date) return isNaN(v.getTime()) ? null : [v.getHours(), v.getMinutes()];

    if(v > 0 && v < 1){ var tm = Math.round(v * 1440); return [Math.floor(tm / 60) % 24, tm % 60]; }

    if(v >= 1 && v <= 24){ var wh = Math.floor(v); return [wh % 24, Math.round((v - wh) * 60) % 60]; }

  var pt = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?$/);

  var lg = s.match(/^[A-Za-z]{3}\s+[A-Za-z]{3}\s+\d{1,2}\s+\d{4}\s+(\d{1,2}):(\d{2})/);

    if(/[Aa][Mm]/.test(s) && ah === 12) ah = 0;
    if(ah <= 23 && am <= 59) return [ah, am];
  }

}
/* "9:30 AM" - for display in tables, timelines and toasts. */
const fmtT = t => { const hm = ocParseHM(t); if(!hm) return '—'; const ap = hm[0] >= 12 ? 'PM' : 'AM'; return `${((hm[0] + 11) % 12) + 1}:${String(hm[1]).padStart(2, '0')} ${ap}`; };
/* "09:30" - for <input type="time"> values. */
const fmtT24 = t => { const hm = ocParseHM(t); return hm ? `${String(hm[0]).padStart(2, '0')}:${String(hm[1]).padStart(2, '0')}` : ''; };

const fmtTx = t => { const hm = ocParseHM(t); return hm ? fmtT(t) : ''; };

/* ================= API ================= */
async function apiSend(action, payload, tok, ms){

method:'POST', redirect:'follow', signal: ctl.signal,
headers:{'Content-Type':'text/plain;charset=utf-8'},

   the JSON parse blew up and every single failure was reported to the user as
   "Network error", which sent people hunting for a connection problem that was
   not there. */
if(!res.ok){ const e=new Error('Server error '+res.status+' — the backend script may need re-deploying.'); e.ocHandled=1; throw e; }
let j;
try{ j = await res.json(); }
catch(pe){ const e=new Error('The server sent something we could not read. If this keeps happening, re-deploy the Apps Script.'); e.ocHandled=1; throw e; }

if(j && j.session){
  try{ S.token = j.session; ocSaveToken(j.session, true); ocScheduleRenew(); }catch(e){}

return j;
}catch(e){

throw new Error(e && e.name==='AbortError' ? 'Server is taking too long — please try again.' : 'Network error — check your connection.');

async function api(action, payload={}, opts={}){
  let j = await apiSend(action, payload, S.token);

     the user back to the login screen: we quietly fetch a fresh token and send
     the very same request again, so the user never has to sign in twice. */
  if(!j.ok && String(j.error).indexOf('AUTH:')===0 && !opts.noRenew){
    try{ await ocRenewToken(); j = await apiSend(action, payload, S.token); }catch(e){}
  }
  if(!j.ok){
    if(String(j.error).indexOf('AUTH:')===0 && !opts.noRelogin){ ocSessionEnded(j.error); }
    throw new Error(j.error||'Request failed');

}

   so it is refreshed silently in the background whenever needed. */

  try{
    var b=String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4) b+='=';
    return JSON.parse(atob(b));

}
function ocSessExp(t){ var p=ocSessBody(t); return p && p.x ? Number(p.x) : 0; }
function ocTokEmail(t){

  var p=ocJwt(t); return p && p.email ? p.email : '';

function ocTokenAlive(tok, skewMs){

var ocGsiReq=null;

function ocShowLogin(msg){

function ocResuming(){
var g=$('#gbtn'); if(!g) return;

/* ---- Safe-mode sign-in ----------------------------------------------------

function ocRedirectUri(){ return location.origin + location.pathname.replace(/index\.html$/, ''); }
function ocRedirectLogin(){
  var n = 'n' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  try{ sessionStorage.setItem('oc_nonce', n); }catch(e){}
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth'
    + '?client_id=' + encodeURIComponent(CONFIG.GOOGLE_CLIENT_ID)
    + '&response_type=id_token'
    + '&scope=' + encodeURIComponent('openid email profile')

  d.style.cssText='margin-top:14px;text-align:center;font-size:13px;color:rgba(255,255,255,.7)';

function ocStart(){

async function boot(){
$('#loginErr').style.display='none';
ocKickBootstrap();
var warm = ocCached('init', {});
/* the app is on screen immediately from the last good answer, the network only refreshes it */
if(warm && warm.profile){ try{ ocPaint(warm, true); }catch(e){} }
try{
ocPaint(await ocFirstLoad(), false);
}catch(err){
if(warm && warm.profile) return; /* keep the cached app rather than throwing the user out */
ocResumeDone();
$('#loginScreen').style.display='flex';
initGSI();
$('#loginErr').style.display='block';

/* NOTE: the Apps Script backend may still reply in Hinglish, so both are matched */

$('#loginErr').innerHTML = esc(msg) +

}

/* ---- Role helpers: the ONE place the front end decides who is what.
   The backend makes the same decision independently; these only choose what
   to draw. Roles: Employee (default) · HR · Admin. */
function ocRole(){ return (S.profile && S.profile.role) || 'Employee'; }
/* What the backend says this person may do. It decides the rules; these flags
   only decide what is worth drawing. */
function ocCaps(){ return (S && S.caps) || {}; }
function ocIsAdmin(){ return ocRole()==='Admin'; }
function ocIsHR(){ return ['HR','Admin'].includes(ocRole()); }
function navItems(){

const CHART_COLORS = { Present:'var(--good)', Working:'var(--blue)', 'Half Day':'var(--warn)', Absent:'var(--crit)', 'Paid Leave':'var(--violet)', Off:'var(--muted)' };
function tipShow(e, text){ const t=$('#barTip'); if(!t) return; t.textContent=text; t.style.display='block'; t.style.left=Math.min(e.clientX+12, innerWidth-170)+'px'; t.style.top=(e.clientY-14)+'px'; }
function ocTipHideNow(){ const t=$('#barTip'); if(t) t.style.display='none'; }
/* A tap also fires the mouse-compatibility events, so the element's own
   onmouseleave used to hide the tooltip in the same gesture that opened it.
   Right after a touch, mouse-driven hides are ignored. */
var ocTipTouchUntil = 0, ocTipTimer = null;
function tipHide(){ if(Date.now() < ocTipTouchUntil) return; ocTipHideNow(); }
/* Charts and the calendar only ever listened for mousemove, so on a phone - the
   only place this app really lives - no tooltip ever appeared. Rather than edit
   every chart, replay the touch onto whatever inline handler is already there. */
document.addEventListener('touchstart', function(ev){
  clearTimeout(ocTipTimer);
  let n = ev.target;
  while(n && n !== document && !n.onmousemove) n = n.parentNode;
  if(n && n.onmousemove && ev.touches[0]){
    const t = ev.touches[0];
    ocTipTouchUntil = Date.now() + 2600;
    try{ n.onmousemove.call(n, {clientX:t.clientX, clientY:t.clientY, target:n}); }catch(e){}
  } else {
    ocTipTouchUntil = 0;
    ocTipHideNow();
  }
}, {passive:true});
document.addEventListener('touchend', function(){
  clearTimeout(ocTipTimer);
  ocTipTimer = setTimeout(ocTipHideNow, 2500);
}, {passive:true});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    const bg = document.getElementById('modalBg');
    if(bg && bg.classList.contains('open')) closeModal();
    else tipHide();
  }
});

function hoursBarChart(trend, fullDay){
  // employee's daily hours — bars with a full-day threshold line
  const data = trend.filter(t=>['Present','Working','Half Day','Absent'].includes(t.status)||t.hours>0);
  if(!data.length) return '<div class="empty">No data yet</div>';
  const W=Math.max(320, data.length*26), H=150, pad=6, maxH=Math.max(10, fullDay+2, ...data.map(d=>d.hours));
  const bw=Math.min(16, (W-2*pad)/data.length-6);
  let bars='';
  data.forEach((d,i)=>{
    const x=pad+i*((W-2*pad)/data.length)+3;
    const h=Math.max(2,(d.hours/maxH)*(H-30));
    const col=d.status==='Absent'?'var(--crit)':(d.hours>=fullDay?'var(--good)':'var(--warn)');
    bars+=`<rect x="${x}" y="${H-20-h}" width="${bw}" height="${h}" rx="4" fill="${col}"
      onmousemove="tipShow(event,'${fmtDW(d.date)}\\n${d.hours||0} hrs · ${d.status}${d.late?' · Late':''}')" onmouseleave="tipHide()"/>`;
    if(i%5===0) bars+=`<text x="${x+bw/2}" y="${H-5}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${d.date.slice(8)}</text>`;
  });
  const thY=H-20-(fullDay/maxH)*(H-30);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="none" role="img" aria-label="Daily working hours">
    <line x1="${pad}" y1="${H-20}" x2="${W-pad}" y2="${H-20}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${pad}" y1="${thY}" x2="${W-pad}" y2="${thY}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="${W-pad}" y="${thY-4}" font-size="9.5" text-anchor="end" fill="var(--muted)">${fullDay}h full day</text>
    ${bars}</svg>
    <div class="legend"><span><i style="background:var(--good)"></i>Full day</span><span><i style="background:var(--warn)"></i>Short hours</span><span><i style="background:var(--crit)"></i>Absent</span></div>`;
}

function teamTrendChart(trend){
  if(!trend||!trend.length) return '<div class="empty">No data yet</div>';
  const W=Math.max(340, trend.length*30), H=170, pad=8;
  const maxV=Math.max(1,...trend.map(d=>d.present+d.absent+d.halfDay+d.leave));
  const bw=Math.min(18,(W-2*pad)/trend.length-8);
  const series=[['present','var(--good)','Present'],['halfDay','var(--warn)','Half Day'],['leave','var(--violet)','Leave'],['absent','var(--crit)','Absent']];
  let bars='';
  trend.forEach((d,i)=>{
    const x=pad+i*((W-2*pad)/trend.length)+4;
    let y=H-22;
    const tip=`${fmtDW(d.date)}\\nPresent ${d.present} · Half ${d.halfDay}\\nLeave ${d.leave} · Absent ${d.absent}`;
    series.forEach(([k,col])=>{
      const h=(d[k]/maxV)*(H-38); if(h<=0)return;
      y-=h;
      bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1.5,h-2)}" rx="3" fill="${col}" onmousemove="tipShow(event,'${tip}')" onmouseleave="tipHide()"/>`;
    });
    if(i%4===0) bars+=`<text x="${x+bw/2}" y="${H-6}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${d.date.slice(8)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Team attendance trend">
    <line x1="${pad}" y1="${H-22}" x2="${W-pad}" y2="${H-22}" stroke="var(--line)"/>${bars}</svg>
    <div class="legend">${series.map(([k,c,n])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>`;
}

function donutChart(parts, centerNum, centerLabel){
  const total = parts.reduce((a,p)=>a+p.v,0)||1;
  let acc=0, segs='';
  const R=54, C=2*Math.PI*R;
  parts.filter(p=>p.v>0).forEach(p=>{
    const frac=p.v/total, off=C*(1-acc), len=C*frac;
    segs+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="16"
      stroke-dasharray="${Math.max(0,len-2)} ${C-len+2}" stroke-dashoffset="${off}" stroke-linecap="butt"
      onmousemove="tipShow(event,'${p.n}: ${p.v}')" onmouseleave="tipHide()"/>`;
    acc+=frac;
  });
  return `<div style="position:relative;width:140px;height:140px;flex:none">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px;transform:rotate(-90deg)">
      <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="16"/>${segs}</svg>
    <div class="donut-center"><b>${centerNum}</b><span>${centerLabel}</span></div></div>
    <div class="legend" style="flex-direction:column;gap:8px">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.n} — <b>${p.v}</b></span>`).join('')}</div>`;
}

function tile(k,v,s,color){ return `<div class="tile"><div class="k"><span class="dot" style="background:${esc(color)}"></span>${esc(k)}</div><div class="v num">${esc(v)}</div><div class="s">${esc(s)}</div></div>`; }
function teamTodayTable(rows){

function haversineM(la1,lo1,la2,lo2){ const R=6371000,r=Math.PI/180,dLa=(la2-la1)*r,dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2; return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

/* ================= LOCATION — robust multi-stage GPS =================
   PURANI PROBLEM: sirf ek getCurrentPosition({enableHighAccuracy:true, timeout:15000}).
   Andar baithe employee ko 15 sec me satellite fix nahi milta -> TIMEOUT -> permanent
   "Location unavailable" error, aur dobara koshish bhi nahi hoti thi.
   AB: Stage 1 = fast network fix (button turant unblock), Stage 2 = watchPosition se
   high-accuracy refine, error code ke hisaab se sahi message, aur Retry link. */
const GPS_GOOD_ACC  = 60;      // metres — itni accuracy mil gayi to refine band
const GPS_REFINE_MS = 90000;   // itni der tak accuracy improve karte rahenge
let gpsWatchId=null, gpsHardTimer=null, gpsLastFix=null;

function stopGPS(){
  if(gpsWatchId!==null){ try{ navigator.geolocation.clearWatch(gpsWatchId); }catch(e){} gpsWatchId=null; }
  if(gpsHardTimer){ clearTimeout(gpsHardTimer); gpsHardTimer=null; }
}
function gpsShow(html, cls){ const d=$('#gpsDot'), t=$('#gpsText'); if(!d||!t) return; d.className='gps-dot '+(cls||''); t.innerHTML=html; }
const GPS_RETRY = ' <a href="javascript:void(0)" onclick="getGPS()" style="color:var(--blue);font-weight:700;text-decoration:underline">Retry</a>';
function gpsIsPWA(){ try{ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }catch(e){ return false; } }
function gpsErrText(err){
  switch(err && err.code){
    case 1:  return gpsIsPWA()
      ? 'Location permission blocked hai — home screen par app icon ko der tak dabao → App info → Permissions → Location → Allow. (iPhone: Settings → Privacy → Location Services → ON). Phir app band karke dobara kholo ya'+GPS_RETRY
      : 'Location permission blocked hai — address bar ke 🔒 / ⓘ icon par tap karo → Permissions → Location → Allow, phir'+GPS_RETRY;
    case 2:  return 'Phone ki Location service band hai — phone settings me Location ON karo, phir'+GPS_RETRY;
    default: return 'GPS signal nahi mil raha (chhat ke neeche ho) — khidki ya darwaze ke paas jaakar'+GPS_RETRY;
  }
}
function gpsApply(p, refining){
  gpsLastFix = p;
  const acc = Math.round(p.coords.accuracy||0);
  cam.pos = {lat:p.coords.latitude, lng:p.coords.longitude, accuracy:acc};
  const weak = acc > GPS_GOOD_ACC;
  gpsShow(`Location locked <b>±${acc}m</b>${(refining&&weak)?' <span style="color:var(--muted)">· accuracy improve ho rahi hai…</span>':''} · <a href="https://maps.google.com/?q=${cam.pos.lat},${cam.pos.lng}" target="_blank" style="color:var(--blue)">map</a>`, weak?'warn':'ok');
  // office geo-fence indicator (live distance)
  const g=S.geofence;
  if(g && g.radius>0 && g.lat && g.lng){
    const dist  = Math.round(haversineM(cam.pos.lat,cam.pos.lng,Number(g.lat),Number(g.lng)));
    const slack = Math.min(acc, 250);            // GPS error ka benefit-of-doubt (max 250m)
    const inside= (dist - slack) <= Number(g.radius);
    cam.inside=inside;
    const row=$('#geoRow'); if(row){ row.style.display='flex';
      $('#geoDot').className='gps-dot '+(inside?'ok':'err');
      $('#geoText').innerHTML= inside
        ? `🏢 You are <b>inside</b> the office zone (${dist}m / ${g.radius}m allowed) ✅`
        : `⛔ You are <b>${dist>=1000?(dist/1000).toFixed(1)+' km':dist+'m'}</b> away from office — you can only punch within ${g.radius}m`; }
  } else cam.inside=true;
  checkReady();
}
function gpsRefine(){
  stopGPS();
  gpsWatchId = navigator.geolocation.watchPosition(
    p=>{ const acc=Math.round(p.coords.accuracy||0);
         if(gpsLastFix && acc > 3*(gpsLastFix.coords.accuracy||1)) return;  // clearly kharaab fix ignore
         gpsApply(p, true);
         if(acc <= GPS_GOOD_ACC) stopGPS(); },
    err=>{ if(!cam.pos) gpsShow(gpsErrText(err),'err');   // ek bhi fix nahi mila tabhi error dikhao
           if(err.code===1) stopGPS(); },
    {enableHighAccuracy:true, timeout:30000, maximumAge:0}
  );
  gpsHardTimer = setTimeout(()=>{ stopGPS(); if(gpsLastFix) gpsApply(gpsLastFix,false); }, GPS_REFINE_MS);
}
function getGPS(){
  stopGPS(); gpsLastFix=null;
  if(!('geolocation' in navigator)){ gpsShow('Is browser me GPS support nahi hai — Chrome (Android) ya Safari (iPhone) me kholo.','err'); return; }
  if(!window.isSecureContext){ gpsShow('Ye page secure (https) par nahi khula, isliye location band hai — official https:// link use karo.','err'); return; }
  if(/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(navigator.userAgent))
    gpsShow('Ye link app ke andar wale browser me khula hai — menu (⋮) → “Open in Chrome / Safari” karo, warna location nahi milegi.','warn');
  else gpsShow('Getting location…','');
  // Stage 1 — fast coarse fix (wifi / mobile tower). Andar baithe bhi 1–3 sec me aa jaata hai.
  navigator.geolocation.getCurrentPosition(
    p =>{ gpsApply(p,true); gpsRefine(); },
    e1=>{ if(e1.code===1){ gpsShow(gpsErrText(e1),'err'); return; }  // permission denied — refine bekaar
          gpsRefine(); },                                            // warna GPS se koshish jaari
    {enableHighAccuracy:false, timeout:12000, maximumAge:60000}
  );
}
function checkReady(){
  const photoOk = !needPhoto() || !!cam.photo;
  const zoneOk = cam.inside !== false;
  const ok = photoOk && cam.pos && zoneOk;
  const b=$('#punchBtn'); if(!b) return;
  b.disabled=!ok;
  $('#punchHint').textContent = ok ? 'All set — tap to punch ✅'
    : !cam.pos ? 'Waiting for GPS lock…'
    : !zoneOk ? 'Reach the office location to punch'
    : 'Selfie still required';
}
async function doPunch(){
  const b=$('#punchBtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> Saving…';
  try{
    const r = await api('punch', {photoBase64:cam.photo, lat:cam.pos.lat, lng:cam.pos.lng, accuracy:cam.pos.accuracy,
      device:navigator.userAgent.slice(0,110),
      /* sent on every punch. A backend that ignores them loses nothing; one that
         honours them can accept a punch that was taken offline and uploaded later,
         and can throw away a duplicate arriving with the same clientId. */
      clientTime: new Date().toISOString(), clientId: 'pn_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)});
    toast(`✅ ${r.type} saved — ${fmtT(r.time)}`, 'ok');
    const d = await api('init', {}, {fresh:true}); S.today=d.today; cam.photo=null;
    renderPunch();
  }catch(e){ toast(e.message,'err'); b.disabled=false; b.innerHTML='Punch'; }
}

/* ================= CALENDAR VIEW ================= */
const CAL_BG = { 'Present':'var(--good)','Working':'var(--blue)','Half Day':'var(--warn)','Absent':'var(--crit)','Paid Leave':'var(--violet)','Week Off':'var(--muted)','Holiday':'var(--muted)','Festival Holiday':'var(--aqua)' };
function calendarView(rows, month){
  // monthly calendar grid for one employee
  const [y,m]=month.split('-').map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const firstDow=new Date(y,m-1,1).getDay();
  const byDate={}; rows.forEach(r=>byDate[r.date]=r);
  const today=new Date().toISOString().slice(0,10);
  let cells='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells+=`<div style="text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0">${d}</div>`);
  for(let i=0;i<firstDow;i++) cells+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=month+'-'+String(d).padStart(2,'0');
    const r=byDate[ds];
    const col=r?CAL_BG[r.status]:'transparent';
    const future=ds>today;
    const tip=r?`${fmtDW(ds)}\\n${r.status}${r.late?' · Late':''}${r.punchIn?'\\nIn '+fmtT(r.punchIn):''}${r.punchOut?' · Out '+fmtT(r.punchOut):''}${r.hoursText?'\\n'+r.hoursText:''}`:fmtDW(ds);
    cells+=`<div onmousemove="tipShow(event,'${tip}')" onmouseleave="tipHide()" style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      background:${r?'color-mix(in srgb,'+col+' 14%, var(--surface))':'var(--surface2)'};border:1.5px solid ${ds===today?'var(--gold)':r?'color-mix(in srgb,'+col+' 35%, transparent)':'var(--hairline)'};${future?'opacity:.35':''}">
      <span style="font-size:12.5px;font-weight:700">${d}</span>
      ${r?`<span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>`:''}
      ${r&&r.late?'<span style="font-size:8px;color:var(--serious);font-weight:800">LATE</span>':''}</div>`;
  }
  const legend=Object.entries({Present:'var(--good)','Half Day':'var(--warn)',Absent:'var(--crit)','Paid Leave':'var(--violet)','Week Off / Holiday':'var(--muted)'})
    .map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('');
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${cells}</div><div class="legend">${legend}</div>`;
}

/* ================= REPORTS ================= */
let repFilter={emp:'', status:'', mode:'table', span:'month', from:'', to:''};

/* ---------- month vs. date-range scope ----------
   Reports can be scoped either to a whole month or to an explicit From -> To
   date range. The choice lives in repFilter.span and is honoured by the table,
   the summary tiles and the CSV download alike. */
function repMonthBounds(m){
  const y=+String(m).slice(0,4), mo=+String(m).slice(5,7);
  const last=new Date(Date.UTC(y,mo,0)).getUTCDate();
  return { from:m+'-01', to:m+'-'+String(last).padStart(2,'0') };
}
function repEnsureRange(){
  const b=repMonthBounds(S.month);
  if(!repFilter.from) repFilter.from=b.from;
  if(!repFilter.to)   repFilter.to=b.to;
  if(repFilter.from>repFilter.to){ const t=repFilter.from; repFilter.from=repFilter.to; repFilter.to=t; }
}
function repMonthsBetween(from,to){
  const out=[]; let y=+from.slice(0,4), m=+from.slice(5,7);
  const ey=+to.slice(0,4), em=+to.slice(5,7);
  while(y<ey || (y===ey && m<=em)){ out.push(y+'-'+String(m).padStart(2,'0')); if(++m>12){ m=1; y++; } if(out.length>=24) break; }
  return out;
}
/* A range can cross month boundaries, so every month it touches is fetched and
   merged, then trimmed back to the exact From -> To window. */
async function repFetchRange(from,to){
  const packs=await Promise.all(repMonthsBetween(from,to).map(m=>api('getReports',{month:m}).then(d=>d.rows||[]).catch(()=>[])));
  const seen={}, out=[];
  packs.forEach(rs=>rs.forEach(r=>{
    const d=String((r&&r.date)||'').slice(0,10);
    if(!d || d<from || d>to) return;
    const k=d+'|'+(r.code||r.name||'');
    if(seen[k]) return; seen[k]=1; out.push(r);
  }));
  return out;
}
function repSetSpan(v){
  repFilter.span=v;
  if(v==='range'){ repEnsureRange(); repFilter.mode='table'; }
  renderReports();
}
function repSpanLabel(){
  return (repFilter.span==='range' && repFilter.from && repFilter.to)
    ? fmtDW(repFilter.from)+' \u2192 '+fmtDW(repFilter.to)
    : MONTH_NAME(S.month);
}
/* The rows currently on screen. Single source of truth for the table AND the
   CSV download, so a download always matches exactly what is displayed. */
function repRows(){
  let rows=S.cache.reports||[];
  if(repFilter.emp)    rows=rows.filter(r=>r.name===repFilter.emp);
  if(repFilter.status) rows=rows.filter(r=>r.status===repFilter.status);
  if(repFilter.span==='range' && repFilter.from && repFilter.to)
    rows=rows.filter(r=>{ const d=String(r.date||'').slice(0,10); return d>=repFilter.from && d<=repFilter.to; });
  return rows;
}
async function renderReports(){
  loadingView('Generating reports…');
  let rows;
  try{
    if(repFilter.span==='range'){ repEnsureRange(); rows=await repFetchRange(repFilter.from, repFilter.to); }
    else { const d=await api('getReports',{month:S.month}); rows=d.rows||[]; }
    if(ocCaps().reportEdit){ S.cache.quota = await api('getEditQuota',{month:S.month},{fresh:true}).catch(function(){ return S.cache.quota||{}; }); }
  }catch(e){ return errView(e); }
  S.cache.reports=rows;
  const isHR=['HR','Admin'].includes(S.profile.role);
  const emps=[...new Set(rows.map(r=>r.name))].sort();
  $('#main').innerHTML=`
  <div class="topbar"><div><h2>Reports</h2><div class="sub">${repSpanLabel()} \u00b7 daily attendance summary \u2014 computed live, never stale</div></div>
  <div class="top-actions">
    ${isHR?`<select class="searchbox" id="repEmp" onchange="repFilter.emp=this.value;drawReports()"><option value="">All employees</option>${emps.map(e=>`<option ${repFilter.emp===e?'selected':''}>${esc(e)}</option>`).join('')}</select>`:''}
    <select class="searchbox" style="max-width:150px" id="repSt" onchange="repFilter.status=this.value;drawReports()">
      <option value="">All statuses</option>${['Present','Half Day','Absent','Paid Leave','Week Off','Festival Holiday'].map(s=>`<option ${repFilter.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <div class="seg"><button class="${repFilter.span==='month'?'on':''}" onclick="repSetSpan('month')">Month</button>
    <button class="${repFilter.span==='range'?'on':''}" onclick="repSetSpan('range')">Date range</button></div>
    ${repFilter.span==='month' ? monthPicker('renderReports()') : `
      <input type="date" class="month-in" id="repFrom" value="${repFilter.from}" onchange="repFilter.from=this.value;renderReports()">
      <span style="color:var(--muted);font-size:12.5px;font-weight:650">to</span>
      <input type="date" class="month-in" id="repTo" value="${repFilter.to}" onchange="repFilter.to=this.value;renderReports()">`}
    ${repFilter.span==='month' ? `<div class="seg"><button class="${repFilter.mode==='table'?'on':''}" onclick="repFilter.mode='table';drawReports()">\u2630 Table</button>
    <button class="${repFilter.mode==='cal'?'on':''}" onclick="repFilter.mode='cal';drawReports()">\u25a6 Calendar</button></div>` : ''}
    <button class="btn btn-good" onclick="exportReportsCSV()">\u2b07 Download Report</button>
  </div></div>
  <div class="grid g4" style="margin-bottom:16px" id="repTiles"></div>
  <div id="repBody"></div>`;
  drawReports();
}
function drawReports(){
  const rows=repRows();
  const sm={present:0,half:0,absent:0,leave:0};
  rows.forEach(r=>{ if(r.status==='Present'||r.status==='Working')sm.present++; else if(r.status==='Half Day')sm.half++; else if(r.status==='Absent')sm.absent++; else if(r.status==='Paid Leave')sm.leave++; });
  $('#repTiles').innerHTML = tile('Present',sm.present,'records','var(--good)')+tile('Half Day',sm.half,'records','var(--warn)')+tile('Absent',sm.absent,'records','var(--crit)')+tile('Paid Leave',sm.leave,'records','var(--violet)');

  if(repFilter.mode==='cal' && repFilter.span!=='range'){
    // calendar always shows ONE employee
    const isHR=['HR','Admin'].includes(S.profile.role);
    const all=S.cache.reports||[];
    const who = repFilter.emp || (isHR ? (all.find(r=>r.email===S.profile.email)?.name || (all[0]&&all[0].name) || '') : S.profile.name);
    const calRows = all.filter(r=>r.name===who);
    $('#repBody').innerHTML = `<div class="card" style="max-width:560px"><h3>${esc(who)} — ${MONTH_NAME(S.month)}</h3>

      ${calendarView(calRows, S.month)}</div>`;
    return;
  }
  $('#repBody').innerHTML='<div class="tbl-wrap"><table id="repTable"></table></div>';
  const sorted=[...rows].sort((a,b)=> b.date===a.date ? a.name.localeCompare(b.name) : b.date.localeCompare(a.date));
  $('#repTable').innerHTML=`<thead><tr><th>Date</th><th>Employee</th><th>Shift</th><th>Punch In</th><th>Punch Out</th><th>Hours</th><th>Status</th><th>Proof</th>${repCanEdit()?'<th>Fix</th>':''}</tr></thead>
  <tbody>${sorted.length?sorted.map(r=>`<tr>
    <td>${fmtDW(r.date)}</td>

/* ---------- Correcting a punch time (HR only) ----------------------------
   A missed or mistyped punch is fixed on the raw Attendance sheet, so the hours,
   the Present/Half/Absent status and the payslip all follow from the correction
   instead of being overridden separately. Two corrections per employee per
   month; the backend keeps the count and refuses the third. */
function repCanEdit(){ return !!ocCaps().reportEdit; }
function repQuota(email){
  const q=S.cache.quota||{};
  const limit=(q.reportLimit==null?2:q.reportLimit);
  const used=(q.report||{})[String(email||'').toLowerCase()]||0;
  return {limit:limit, used:used, left:Math.max(0,limit-used)};
}
function repEditBtn(r){
  if(['Week Off','Holiday','Festival Holiday'].includes(r.status)) return '';
  const k=repQuota(r.email);
  if(k.left<=0) return `<span class="chip c-off" title="Both corrections for this employee are used this month">0 left</span>`;

}
function repEditModal(r){

function csvCell(v){
  v = (v==null ? '' : String(v));
  /* A cell that opens with = + - @ (or a tab / CR) is executed as a formula by
     Excel and Sheets. An employee called "=cmd|..." would otherwise run on
     whoever opens the export, so the value is pinned as text. */
  if(/^[=+\-@\t\r]/.test(v)) v = "'" + v;
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function repFileTag(){
  const who=repFilter.emp ? repFilter.emp.trim().replace(/[^A-Za-z0-9]+/g,'_') : 'all_employees';
  return who+'_'+(repFilter.span==='range' ? repFilter.from+'_to_'+repFilter.to : S.month);
}
function exportReportsCSV(){
  /* Exports exactly the filtered view: only the chosen employee when one is
     selected, and the whole team when "All employees" is selected. */
  const rows=[...repRows()].sort((a,b)=> String(a.date)===String(b.date) ? String(a.name).localeCompare(String(b.name)) : String(a.date).localeCompare(String(b.date)));
  if(!rows.length){ toast('Nothing to download for this selection'); return; }
  const head=['Date','Employee','Code','Shift','Punch In','Punch Out','Hours','Status','Late','Leave Type'];
  const csv=[head.join(',')].concat(rows.map(r=>[r.date,r.name,r.code,fmtTx(r.timing),fmtTx(r.punchIn)||'',fmtTx(r.punchOut)||'',r.hours??'',r.status,r.late?'Yes':'',r.leaveType||''].map(csvCell).join(','))).join('\n');
  dl(csv,'attendance_report_'+repFileTag()+'.csv');
}
function dl(text,name){
  const url = URL.createObjectURL(new Blob(['\ufeff'+text], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);   /* the old code leaked every export */
}

/* ================= BULK IMPORT (Excel / CSV) ================= */
var IMP_ROWS = [];
var IMP_COLS = ['Employee Name','Useremail','Employee Code','Timing','Employee Type','Status','Role','Department','Designation','Basic Salary','Week Off Day'];
function impNorm(s){ var o=''; s=String(s).toLowerCase(); for(var i=0;i<s.length;i++){ var c=s.charCodeAt(i); if(c>=97&&c<=122) o+=s.charAt(i); } return o; }
function impPick(obj, keys){ for(var k in obj){ if(keys.indexOf(impNorm(k))>=0){ var val=obj[k]; if(val===null||val===undefined) return ''; return String(val).trim(); } } return ''; }
function impMap(o){
  return {
    name: impPick(o,['employeename','name','fullname','empname']),
    email: impPick(o,['useremail','email','emailid','mail','gmail']).toLowerCase(),
    code: impPick(o,['employeecode','code','empcode','empid','employeeid']),
    timing: impPick(o,['timing','shift','shifttiming','intime']) || '09:30',
    type: impPick(o,['employeetype','type']) || 'Staff',
    status: impPick(o,['status']) || 'Active',
    /* The Role column is read only for Admin. For HR it is dropped here, so
       the request never carries a role and the backend keeps the existing
       one (or Employee for a new person). The form has the same rule. */
    role: ocIsAdmin() ? (impPick(o,['role']) || 'Employee') : undefined,
    department: impPick(o,['department','dept']),
    designation: impPick(o,['designation','title','post']),
    basicSalary: impPick(o,['basicsalary','salary','basic','ctc']) || '0',
    weekOffDay: impPick(o,['weekoffday','weekoff','offday','off']) || 'Sunday'
  };
}
var IMP_ROLES = ['Employee','HR','Admin'];
function impValid(r){
  var e=[];
  if(!r.name) e.push('Name missing');
  var at=r.email.indexOf('@');
  if(at<1 || r.email.indexOf('.',at) < at+2) e.push('Email invalid');
  if(r.role!==undefined){
    /* normalise "hr" / "ADMIN" and reject anything that is not a real role */
    var m=IMP_ROLES.filter(function(x){ return x.toLowerCase()===String(r.role).trim().toLowerCase(); })[0];
    if(m) r.role=m; else e.push('Role must be Employee, HR or Admin');
    if(r.email===String(S.profile.email||'').toLowerCase() && r.role!==S.profile.role) e.push('Cannot change your own role');
  }
  return e;
}
function importModal(){
  IMP_ROWS=[];
  modal('<h3>Bulk Import Employees</h3>'
   +'<p class="msub">Upload an Excel (.xlsx / .xls) or CSV file. The first row must contain the column headers. Leave Employee Code blank and the next code will be assigned automatically.</p>'
   +'<div style="font-size:12px;color:var(--muted);line-height:1.7;background:var(--surface2);border:1px solid var(--hairline);border-radius:10px;padding:10px 12px"><b>Columns:</b> '+IMP_COLS.join(' &middot; ')+'<br>'
   +(ocIsAdmin() ? '<b>Role</b> may be Employee, HR or Admin.' : '<b>Role</b> column is ignored &mdash; only Admin can assign roles. New people are added as Employee; existing people keep their role.')
   +'<br><a href="#" onclick="impTemplate();return false" style="color:var(--blue);font-weight:600">Download sample CSV template</a></div>'
   +'<label>Choose file</label><input type="file" id="impFile" accept=".xlsx,.xls,.csv" onchange="impRead(this)">'
   +'<div id="impPrev" style="margin-top:14px"></div>'
   +'<div class="modal-foot"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-gold" id="impGo" disabled onclick="impRun()">Import</button></div>');
}
function impTemplate(){
  var nl=String.fromCharCode(10);
  var csv=IMP_COLS.join(',')+nl+'Ravi Kumar,ravi@oakcraft.in,OC010,09:30,Staff,Active,Employee,Sales,Executive,20000,Sunday'+nl;
  dl(csv, 'employee_import_template.csv');
}
function impLib(){
  return new Promise(function(res,rej){
    if(window.XLSX) return res();
    var s=document.createElement('script');
    s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload=function(){ res(); };
    s.onerror=function(){ rej(new Error('Could not load the Excel library. Check your internet connection or use a CSV file.')); };
    document.head.appendChild(s);
  });
}
async function impRead(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var prev=$('#impPrev'); prev.innerHTML='<span class="msub">Reading file...</span>';
  try{
    await impLib();
    var buf=await f.arrayBuffer();
    var wb=XLSX.read(buf,{type:'array'});
    var raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
    IMP_ROWS=raw.map(impMap).filter(function(r){ return r.name||r.email||r.code; });
    impPreview();
  }catch(err){ prev.innerHTML='<span style="color:var(--crit)">'+esc(err.message)+'</span>'; }
}
function impPreview(){
  var prev=$('#impPrev'), go=$('#impGo');
  if(!IMP_ROWS.length){ prev.innerHTML='<span style="color:var(--crit)">No rows found in the file.</span>'; go.disabled=true; return; }
  var existing=((S.cache&&S.cache.users)||[]).map(function(u){ return Object.keys(u).map(function(k){ return String(u[k]); }).join('|').toLowerCase(); });
  ocAssignCodes(IMP_ROWS);
  var seen=[], ok=0, bad=0;
  var html='<div class="tbl-wrap" style="max-height:240px;overflow:auto"><table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Code</th><th>Status</th></tr></thead><tbody>';
  IMP_ROWS.forEach(function(r,i){
    var e=impValid(r);
    if(r.email && seen.indexOf(r.email)>=0) e.push('Duplicate in file');
    seen.push(r.email);
    var dup = r.email && existing.some(function(s){ return s.indexOf(r.email)>=0; });
    if(e.length){ bad++; } else { ok++; }
    var st = e.length ? '<span class="chip c-absent">'+esc(e.join(', '))+'</span>' : (dup ? '<span class="chip c-late">Will update</span>' : '<span class="chip c-present">New</span>');
    html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.code)+(r.autoCode?' <span class="msub" style="font-size:11px">(auto)</span>':'')+'</td><td>'+st+'</td></tr>';
  });
  html+='</tbody></table></div><p class="msub" style="margin-top:8px">'+ok+' valid row(s) will be imported, '+bad+' skipped.</p>';
  prev.innerHTML=html;
  go.disabled = (ok===0);
}
async function impRun(){
  var go=$('#impGo'); go.disabled=true;
  var list=IMP_ROWS.filter(function(r){ return impValid(r).length===0; });
  var done=0, fails=[];
  for(var i=0;i<list.length;i++){
    go.textContent='Importing '+(i+1)+' / '+list.length+'...';
    try{ await api('saveUser', list[i]); done++; }
    catch(err){ fails.push(list[i].email+' - '+err.message); }
  }
  closeModal();
  toast(done+' employee(s) imported'+(fails.length?', '+fails.length+' fail':''), fails.length?'':'ok');
  await renderUsers();
  if(fails.length){
    modal('<h3>Import Report</h3><p class="msub">'+done+' successful, '+fails.length+' failed</p><div style="font-size:12.5px;line-height:1.8;color:var(--crit)">'+fails.map(esc).join('<br>')+'</div><div class="modal-foot"><button class="btn btn-o" onclick="closeModal()">Close</button></div>');
  }
}

async function saveUser(btn, editingEmail){
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    const p={name:$('#uName').value.trim(), code:$('#uCode').value.trim(), email:$('#uEmail').value.trim(),
      timing:$('#uTiming').value, weekOffDay:$('#uWeekOff').value, type:$('#uType').value,
      department:$('#uDept').value, designation:$('#uDesig').value, basicSalary:$('#uSalary').value};

/* Payout may be edited by Accounts and HR only, three times per employee per
   month. The button carries the count that is left and disappears once it runs
   out; the backend refuses anything the button would not allow anyway, so this
   is a courtesy rather than the control. */
function payQuota(email){
  const q=S.cache.quota||{};
  const limit=(q.payoutLimit==null?3:q.payoutLimit);
  const used=(q.payout||{})[String(email||'').toLowerCase()]||0;
  return {limit:limit, used:used, left:Math.max(0,limit-used)};
}
function payEditBtn(i,r){
  const q=S.cache.quota||{};
  if(!q.canEditPayout) return '<span class="chip c-off" title="Only Accounts and HR can edit Payout">View only</span>';
  const k=payQuota(r.email);
  if(k.left<=0) return `<span class="chip c-absent" title="All ${k.limit} edits for this employee are used for this month">No edits left</span>`;
  return `<button class="btn btn-o btn-sm" onclick="payModal(${i})">Edit <span style="color:var(--muted);font-weight:500">· ${k.left} left</span></button>`;
}
function payModal(i){
  const r=S.cache.payout.rows[i];
  const k=payQuota(r.email);
  if(!(S.cache.quota||{}).canEditPayout) return toast('Only Accounts and HR can edit Payout','err');
  if(k.left<=0) return toast('All '+k.limit+' edits for '+r.name+' are used this month','err');
  modal(`<h3>${esc(r.name)} — ${MONTH_NAME(r.month)}</h3><div class="msub">Verify Advance / basic and save — it will be recorded in the Payout sheet<br><b>${k.left} of ${k.limit} edits left for this employee this month</b> · the count starts again on the 1st</div>
  <div class="grid g3" style="margin:14px 0;text-align:center">
    <div class="tile" style="padding:12px"><div class="k">Absent</div><div class="v" style="font-size:20px">${r.absent}</div></div>
    <div class="tile" style="padding:12px"><div class="k">Half Days</div><div class="v" style="font-size:20px">${r.halfDays}</div></div>
    <div class="tile" style="padding:12px"><div class="k">Paid Leave</div><div class="v" style="font-size:20px">${r.paidLeave}</div></div>
  </div>
  <label>Basic Salary</label><input type="number" id="pBasic" value="${r.basicSalary}">
  <label>Advance Salary (will be deducted)</label><input type="number" id="pAdv" value="${r.advance}">
  <label>Overtime Hours — auto ${r.autoOvertimeHours||0} hrs from punches · ₹${r.overtimeRate||0}/hr on a ${r.shiftHours||0} hr shift · leave blank to use auto</label><input type="number" step="0.25" id="pOT" placeholder="auto: ${r.autoOvertimeHours||0}" value="${(r.overtimeOverride===''||r.overtimeOverride==null)?'':r.overtimeOverride}">
  <label>Late Deduction (₹) — ${r.lateDays} late days (${r.chargeableLate} chargeable)</label><input type="number" id="pLate" value="${r.lateDeduction}">
  <div class="modal-foot"><button class="btn btn-o" onclick="closeModal()">Cancel</button>
  <button class="btn btn-p" onclick="savePayout(${i},'Draft',this)">Save Draft</button>
  <button class="btn btn-good" onclick="savePayout(${i},'Final',this)">Save Final</button></div>`);
}
async function savePayout(i,status,btn){
  const r=S.cache.payout.rows[i];
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    await api('savePayout',{month:r.month,email:r.email,basicSalary:$('#pBasic').value,advance:$('#pAdv').value,overtimeHours:$('#pOT').value,lateDeduction:$('#pLate').value,status});
    closeModal(); toast('Payout saved ('+status+') ✅','ok'); renderPayout();
  }catch(e){ toast(e.message,'err'); btn.disabled=false; btn.textContent='Save'; }
}

function exportPayoutCSV(){
  const d=S.cache.payout;
  const head=['Month','Code','Name','Total Days','Working Days','Absent','Half Days','Paid Leave','Week Off','Festival','Payable Days','Basic','Per Day','Gross','Overtime Hours','Overtime Amount','Advance','Late Days','Late Deduction','Net Payable'];
  const csv=[head.map(csvCell).join(',')].concat(d.rows.map(r=>[r.month,r.code,r.name,r.totalDays,r.workingDays,r.absent,r.halfDays,r.paidLeave,r.weekOff,r.festival,r.payableDays,r.basicSalary,r.perDay,r.gross,r.overtimeHours,r.overtimeAmount,r.advance,r.lateDays,r.lateDeduction,r.net].map(csvCell).join(','))).join('\n');
  dl(csv,'payout_'+d.month+'.csv');
}

/* ============ SPEED + OFFLINE LAYER ============ */
var OC_READS = ['init','getDashboard','getReports','getMyAttendance','getLeaves','getUsers','getPayout','getMyPayout','getEditQuota','getSettings','getHolidays','getRawAttendance','getAudit','getAccessRequests'];
var OC_NORERENDER = ['init'];
var OC_INFLIGHT = {};
var OC_RERENDERED = {};
function ocKey(a,p){ try{ return 'occ:'+a+':'+JSON.stringify(p||{}); }catch(e){ return 'occ:'+a; } }
function ocGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function ocSet(k,d){
  try{ localStorage.setItem(k, JSON.stringify({t:Date.now(), d:d})); }
  catch(e){ ocTrim(); try{ localStorage.setItem(k, JSON.stringify({t:Date.now(), d:d})); }catch(e2){} }
}
/* Dropping the whole cache on one quota error threw away every screen's offline
   copy. Evict the oldest entries instead, and never touch the outbox. */
function ocTrim(){
  try{
    var rows=[];
    Object.keys(localStorage).forEach(function(k){
      if(k.indexOf('occ:')!==0) return;
      var t=0; try{ t=(JSON.parse(localStorage.getItem(k))||{}).t||0; }catch(e){}
      rows.push([k,t]);
    });
    rows.sort(function(a,b){ return a[1]-b[1]; });
    rows.slice(0, Math.max(1, Math.ceil(rows.length/3))).forEach(function(r){ localStorage.removeItem(r[0]); });
  }catch(e){}
}
function ocAge(t){
  var m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'just now';
  if(m<60) return m+' min ago';
  var h=Math.round(m/60); if(h<24) return h+' hours ago';
  return Math.round(h/24)+' days ago';
}
function ocBanner(show,msg){
  var el=document.getElementById('ocOffBar');
  if(!el){
    el=document.createElement('div'); el.id='ocOffBar';
    el.style.cssText='position:fixed;left:0;right:0;top:0;z-index:300;background:#eda100;color:#151a26;font-size:12.5px;font-weight:700;text-align:center;padding:6px 10px;display:none';
    document.body.appendChild(el);
  }
  if(msg) el.textContent=msg;
  el.style.display = show ? 'block' : 'none';
}
/* ============ OUTBOX — writes attempted with no signal ============
   applyLeave carries its own dates, so uploading it late changes nothing.
   punch is different: the backend stamps the moment the request arrives, so a
   punch queued at 9:30 and uploaded at 11:00 would be recorded at 11:00 — wrong
   attendance. It is therefore queued ONLY once the backend tells us (via
   caps.clientTime) that it uses the time the app sends. Until then an offline
   punch is refused, with a message that says why. */
var OC_OUTBOX_KEY = 'oc_outbox';
function ocQueueable(action){
  if(action === 'applyLeave') return true;
  if(action === 'punch') return !!(typeof S === 'object' && S && S.caps && S.caps.clientTime);
  return false;
}
function ocOutbox(){ try{ return JSON.parse(localStorage.getItem(OC_OUTBOX_KEY) || '[]'); }catch(e){ return []; } }
function ocOutboxSave(l){ try{ localStorage.setItem(OC_OUTBOX_KEY, JSON.stringify(l)); }catch(e){} }
function ocOutboxAdd(action, payload){
  var l = ocOutbox();
  if(l.length >= 40) return false;
  l.push({ id:'ob_'+Date.now()+'_'+Math.random().toString(36).slice(2,8), action:action, payload:payload, at:Date.now() });
  ocOutboxSave(l); ocOutboxBanner(); return true;
}
function ocOutboxBanner(){
  var n = ocOutbox().length;
  if(n) ocBanner(true, n + (n === 1 ? ' entry is' : ' entries are') + ' saved on this phone and waiting to send');
  else if(navigator.onLine) ocBanner(false);
}
var ocFlushing = false;
async function ocOutboxFlush(){
  if(ocFlushing || !navigator.onLine) return;
  var l = ocOutbox();
  if(!l.length) return;
  ocFlushing = true;
  var sent = 0, refused = [];
  try{
    while(l.length){
      var item = l[0];
      try{
        await window.api(item.action, item.payload);
        sent++; l.shift(); ocOutboxSave(l);
      }catch(e){
        var m = String((e && e.message) || e);
        /* still no usable connection - leave it queued and try again later */
        if(/Network error|taking too long|offline/i.test(m)) break;
        /* the backend actively refused it; retrying forever would never help */
        refused.push(item.action + ' — ' + m);
        l.shift(); ocOutboxSave(l);
      }
    }
  } finally {
    ocFlushing = false;
    ocOutboxBanner();
    if(sent) { toast(sent + (sent === 1 ? ' saved entry has' : ' saved entries have') + ' been sent ✅', 'ok'); ocRerender(); }
    if(refused.length) toast('Could not send: ' + refused[0], 'err');
  }
}
window.addEventListener('online', function(){ setTimeout(ocOutboxFlush, 600); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) ocOutboxFlush(); });

function ocRerender(){
  try{ if(typeof go==='function' && typeof S==='object' && S && S.view) go(S.view); }catch(e){}
}
(function(){
  if(typeof api!=='function') return;
  var ORIG = api;
  window.api = function(action, payload, opts){
    var isRead = OC_READS.indexOf(action) >= 0;
    var offline = (navigator.onLine === false);
    if(!isRead){
      if(offline){
        if(ocQueueable(action) && ocOutboxAdd(action, payload)){
          setTimeout(function(){ toast('No signal — saved on this phone, it will be sent by itself','ok'); }, 60);
          return Promise.resolve({queued:true});
        }
        return Promise.reject(new Error(action === 'punch'
          ? 'No internet. A punch has to reach the server straight away so the time is recorded correctly.'
          : 'You are offline. This action needs an internet connection.'));
      }
      return ORIG(action, payload, opts);
    }
    var key = ocKey(action, payload);
    var cached = ocGet(key);
    if(offline){
      if(cached){ ocBanner(true, 'Offline — showing data from ' + ocAge(cached.t)); return Promise.resolve(cached.d); }
      return Promise.reject(new Error('You are offline and no saved data is available for this screen.'));
    }
    /* opts.fresh skips the cache entirely. Needed straight after a write - the
       punch screen used to redraw from the pre-punch snapshot and still say
       "Punch In" after you had already punched in. */
    if(opts && opts.fresh){
      return ORIG(action, payload, opts).then(function(d){ ocSet(key, d); ocBanner(false); return d; });
    }
    var net = OC_INFLIGHT[key];
    if(!net){
      net = ORIG(action, payload, opts).then(function(d){
        delete OC_INFLIGHT[key];
        var changed = !cached || JSON.stringify(cached.d) !== JSON.stringify(d);
        ocSet(key, d);
        ocBanner(false);
        if(cached && changed && !OC_RERENDERED[key] && OC_NORERENDER.indexOf(action) < 0){
          OC_RERENDERED[key] = 1;
          setTimeout(function(){ delete OC_RERENDERED[key]; ocRerender(); }, 0);
        }
        return d;
      }, function(err){ delete OC_INFLIGHT[key]; throw err; });
      OC_INFLIGHT[key] = net;
    }
    if(cached){
      net.catch(function(){ ocBanner(true, 'Cannot reach the server — showing data from ' + ocAge(cached.t)); });
      return Promise.resolve(cached.d);
    }
    return net;
  };
})();
window.addEventListener('online', function(){ ocBanner(false); ocRerender(); });
window.addEventListener('offline', function(){ ocBanner(true, 'You are offline — showing saved data'); });
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(!reg) return;
      /* sw.js has always listened for a 'skipWaiting' message and nothing ever
         sent one, so a new version sat waiting until every tab was closed. */
      function offer(w){
        if(!w) return;
        w.addEventListener('statechange', function(){
          if(w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar(w);
        });
      }
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);
      reg.addEventListener('updatefound', function(){ offer(reg.installing); });
    }).catch(function(){});
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(reloading) return; reloading = true; location.reload();
    });
    setTimeout(ocOutboxFlush, 1500);
  });
  function showUpdateBar(worker){
    if(document.getElementById('ocUpdBar')) return;
    var b = document.createElement('div');
    b.id = 'ocUpdBar';
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:320;background:#0f1420;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13.5px;box-shadow:0 18px 40px -14px rgba(0,0,0,.6)';
    b.innerHTML = '<span style="flex:1">A newer version is ready</span>';
    var go = document.createElement('button');
    go.textContent = 'Update';
    go.style.cssText = 'background:#e8b34b;color:#0f1420;border:0;border-radius:9px;padding:8px 14px;font-weight:700;min-height:36px';
    go.onclick = function(){ try{ worker.postMessage('skipWaiting'); }catch(e){ location.reload(); } };
    var later = document.createElement('button');
    later.textContent = 'Later';
    later.style.cssText = 'background:transparent;color:#c9c8c2;border:0;padding:8px 6px;min-height:36px';
    later.onclick = function(){ b.remove(); };
    b.appendChild(go); b.appendChild(later);
    document.body.appendChild(b);
  }
}


/* ============ AUTO EMPLOYEE CODE ============ */
function ocPad(n,len){ var s=String(n); while(s.length<len){ s='0'+s; } return s; }
function ocParseCode(v){
  v = String(v==null?'':v).trim();
  if(v.length<2 || v.length>14) return null;
  var i=0;
  while(i<v.length){ var c=v.charCodeAt(i); if(c>=48 && c<=57) break; i++; }
  if(i===0 || i===v.length) return null;
  var p=v.slice(0,i), d=v.slice(i);
  var pu=p.toUpperCase();
  for(var k=0;k<pu.length;k++){ var a=pu.charCodeAt(k); if(a<65 || a>90) return null; }
  for(var j=0;j<d.length;j++){ var b=d.charCodeAt(j); if(b<48 || b>57) return null; }
  return { p:pu, n:parseInt(d,10), pad:d.length };
}
function ocUserCode(u){
  var val='';
  Object.keys(u).forEach(function(k){ if(!val && String(k).toLowerCase().indexOf('code')>=0){ val=String(u[k]==null?'':u[k]).trim(); } });
  return val;
}
function ocCodeInfo(){
  var users = (typeof S==='object' && S && S.cache && S.cache.users) ? S.cache.users : [];
  var best=null, used={};
  users.forEach(function(u){
    var val=ocUserCode(u);
    var m=ocParseCode(val);
    if(m){ used[val.toUpperCase()]=1; if(!best || m.n>best.n) best=m; }
  });
  if(!best) best={ p:'OC', n:0, pad:3 };
  return { prefix:best.p, pad:best.pad, max:best.n, used:used };
}
function ocNextCode(extraUsed){
  var info=ocCodeInfo();
  var used=info.used;
  if(extraUsed){ extraUsed.forEach(function(c){ if(c) used[String(c).toUpperCase()]=1; }); }
  var n=info.max+1;
  var code=info.prefix+ocPad(n,info.pad);
  var guard=0;
  while(used[code.toUpperCase()] && guard<5000){ n++; code=info.prefix+ocPad(n,info.pad); guard++; }
  return code;
}
function ocAssignCodes(rows){
  var used=[];
  rows.forEach(function(r){ if(r.code) used.push(r.code); });
  rows.forEach(function(r){
    if(!r.code){ var c=ocNextCode(used); r.code=c; r.autoCode=true; used.push(c); }
  });
}
(function(){
  if(typeof userModal!=='function') return;
  var OM=userModal;

    var out=OM.apply(null, arguments);
    try{
      var el=document.getElementById('uCode');
      if(el && !String(el.value||'').trim()){

    return out;
  };
})();

/* ------------ FEWER ROUND TRIPS ------------
   Every backend call carries roughly 1.5 s of fixed Apps Script overhead, so the
   cheapest speed-up is simply to make fewer calls and to make them earlier. */

/* Wakes the backend up while Google Sign-In is still loading. The answer is thrown
   away - it only removes the cold-start delay from the first real request. */
try{ fetch(CONFIG.API_URL, {method:'GET', redirect:'follow', cache:'no-store'}).catch(function(){}); }catch(e){}

/* Profile + dashboard in a single request, with a graceful fall back to the old
   two-call path if the backend does not know this action yet. */
var OC_BOOT_REQ = null;
function ocCached(a, p){ var c = ocGet(ocKey(a, p||{})); return c ? c.d : null; }
/* Fires the single bootstrap request as soon as a token exists - in parallel with
   Google Sign-In finishing - so the round trip is already half done by the time
   boot() needs the answer. */
function ocKickBootstrap(){
if(!OC_BOOT_REQ && S.token){
OC_BOOT_REQ = apiSend('bootstrap', {month:S.month}, S.token, 15000).catch(function(){ return null; });
}
return OC_BOOT_REQ;
}
async function ocFirstLoad(){
var j = null;
try{ j = await (OC_BOOT_REQ || ocKickBootstrap()); }catch(e){}
OC_BOOT_REQ = null;
var d = j && j.ok ? j.data : null;
if(d && d.init){
ocSet(ocKey('init', {}), d.init);
if(d.dashboard){ ocSet(ocKey('getDashboard', {month:S.month}), d.dashboard); }
return d.init;
}
if(j && !j.ok && String(j.error).indexOf('AUTH:')===0) throw new Error(j.error);
/* backend does not know 'bootstrap' (older deployment) - fall back to the old path */
return await api('init', {}, {noRelogin:true});
}

/* Once the dashboard is on screen, warm the remaining screens in ONE request so
   switching tabs feels instant. Any failure here is silent on purpose. */
function ocPrefetch(){
  if(navigator.onLine === false) return;
  var role = (S.profile && S.profile.role) || 'Employee';
  var isHR = ['Admin', 'HR'].indexOf(role) >= 0;
  var want = [
    {key:'getReports',  action:'getReports',  payload:{month:S.month}},
    {key:'getLeaves',   action:'getLeaves',   payload:{}},
    {key:'getHolidays', action:'getHolidays', payload:{}}
  ];
  if(isHR){
    want.push({key:'getUsers',          action:'getUsers',          payload:{}});
    want.push({key:'getPayout',         action:'getPayout',         payload:{month:S.month}});
    want.push({key:'getAccessRequests', action:'getAccessRequests', payload:{}});
  } else {
    want.push({key:'getMyPayout',       action:'getMyPayout',       payload:{month:S.month}});
  }
  if(S.caps && (S.caps.payoutEdit || S.caps.reportEdit || S.caps.payoutView)){
    want.push({key:'getEditQuota',    action:'getEditQuota',    payload:{month:S.month}});
  }
  if(role === 'Admin'){
    want.push({key:'getSettings', action:'getSettings', payload:{}});
    want.push({key:'getAudit',    action:'getAudit',    payload:{}});
  }
  setTimeout(function(){
    apiSend('batch', {actions:want}, S.token).then(function(j){
      if(!j || !j.ok || !j.data) return;
      want.forEach(function(w){
        var r = j.data[w.key];
        if(r && r.ok){ ocSet(ocKey(w.action, w.payload), r.data); }
      });
    }).catch(function(){});
  }, 400);
}
