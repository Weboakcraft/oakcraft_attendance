<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<script>/* apply saved theme early to avoid flash */(function(){try{var t=localStorage.getItem('oc_theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<title>OakCraft Attendance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f1420'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23e8b34b' font-family='Arial' font-weight='bold'>O</text></svg>">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://accounts.google.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ============ OAKCRAFT ATTENDANCE — PREMIUM UI ============ */
:root{
  color-scheme: light;
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f9f9f7;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:#e1e0d9; --hairline:rgba(11,11,11,.08);
  --brand:#0f1420; --brand2:#1c2536; --gold:#e8b34b; --gold2:#c9962f;
  --blue:#2a78d6; --aqua:#1baf7a; --yellow:#eda100; --red:#e34948; --violet:#4a3aa7; --orange:#eb6834;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --goodtext:#006300;
  --shadow:0 1px 2px rgba(15,20,32,.05),0 8px 24px -12px rgba(15,20,32,.18);
  --shadow-lg:0 24px 60px -20px rgba(15,20,32,.35);
  --r:16px; --r-sm:10px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
/* ===== DARK THEME (toggled via data-theme="dark" on <html>) ===== */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#161615;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --hairline:rgba(255,255,255,.10);
  --blue:#3987e5; --aqua:#199e70; --yellow:#c98500; --red:#e66767; --violet:#9085e9; --orange:#d95926;
  --goodtext:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,120,214,.15)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
h1,h2,h3{letter-spacing:-.02em}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 70% -10%,#24314d 0%,#0f1420 55%,#0a0e17 100%);z-index:100;padding:20px}
.login-card{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(18px);border-radius:24px;padding:44px 36px;text-align:center;box-shadow:var(--shadow-lg);animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo-mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;font-weight:800;color:#0f1420;box-shadow:0 12px 30px -8px rgba(232,179,75,.5)}
.login-card h1{color:#fff;font-size:23px;margin-bottom:6px}
.login-card p{color:rgba(255,255,255,.55);font-size:13.5px;margin-bottom:28px}
#gbtn{display:flex;justify-content:center;min-height:44px}
.login-foot{margin-top:26px;color:rgba(255,255,255,.35);font-size:11.5px}
.login-err{margin-top:16px;color:#ffb4b4;font-size:13px;background:rgba(227,73,72,.12);border:1px solid rgba(227,73,72,.3);border-radius:10px;padding:10px;display:none}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;background:linear-gradient(180deg,var(--brand) 0%,#0b0f19 100%);color:#fff;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:22px 14px calc(16px + var(--sab));z-index:40}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.side-brand .logo-mark{width:38px;height:38px;border-radius:11px;margin:0;font-size:19px}
.side-brand b{font-size:15.5px;letter-spacing:.01em}
.side-brand span{display:block;font-size:10.5px;color:rgba(255,255,255,.45);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.nav{flex:1;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;padding:10.5px 12px;border-radius:11px;color:rgba(255,255,255,.62);font-size:13.5px;font-weight:600;text-align:left;transition:all .15s;width:100%}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:linear-gradient(90deg,rgba(232,179,75,.18),rgba(232,179,75,.06));color:var(--gold)}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.side-user{display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.side-user .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .rl{font-size:11px;color:rgba(255,255,255,.45)}
.side-user button{color:rgba(255,255,255,.5);padding:6px}
.side-user button:hover{color:var(--red)}.theme-toggle:hover{color:var(--gold)!important}.theme-toggle .ic-sun{display:none}.theme-toggle .ic-moon{display:block}:root[data-theme="dark"] .theme-toggle .ic-sun{display:block}:root[data-theme="dark"] .theme-toggle .ic-moon{display:none}

.main{flex:1;min-width:0;margin-left:236px;padding:26px 30px calc(30px + var(--sab));max-width:1280px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h2{font-size:22px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- COMPONENTS ---------- */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;position:relative;overflow:hidden}
.tile .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.tile .k .dot{width:9px;height:9px;border-radius:3px;flex:none}
.tile .v{font-size:30px;font-weight:750;margin-top:8px;letter-spacing:-.03em}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:11px;font-weight:650;font-size:13.5px;transition:all .15s;border:1px solid transparent}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{background:var(--brand2);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#151a26}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-o{border-color:var(--line);color:var(--ink2);background:var(--surface)}
.btn-o:hover{border-color:var(--muted);color:var(--ink)}
.btn-danger{background:var(--crit);color:#fff}
.btn-good{background:var(--good);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-present{background:rgba(12,163,12,.12);color:var(--goodtext)}
.c-working{background:rgba(42,120,214,.12);color:var(--blue)}
.c-half{background:rgba(250,178,25,.15);color:#9a6b00}
.c-absent{background:rgba(208,59,59,.11);color:var(--crit)}
.c-leave{background:rgba(74,58,167,.11);color:var(--violet)}
.c-off{background:rgba(137,135,129,.14);color:var(--ink2)}
.c-late{background:rgba(236,131,90,.14);color:#b4522b}
.c-pending{background:rgba(250,178,25,.15);color:#9a6b00}
.c-approved{background:rgba(12,163,12,.12);color:var(--goodtext)}
.c-rejected{background:rgba(208,59,59,.11);color:var(--crit)}
:root[data-theme="dark"] .c-half,:root[data-theme="dark"] .c-pending{color:#fab219}:root[data-theme="dark"] .c-late{color:#ec835a}
.tbl-wrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-bottom:1px solid var(--hairline);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface2)}
td .who{display:flex;align-items:center;gap:9px}
td .who .avatar{width:30px;height:30px;font-size:12px}
td .who .em{font-size:11.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.month-in{width:auto}
.searchbox{max-width:230px}

/* ---------- PUNCH VIEW ---------- */
.punch-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.cam-card{position:relative;overflow:hidden;padding:0;background:#0b0f19}
.cam-stage{position:relative;aspect-ratio:4/3.4;display:flex;align-items:center;justify-content:center;background:#0b0f19}
#camVideo,#camCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#camCanvas{display:none}
.cam-off{color:rgba(255,255,255,.5);text-align:center;font-size:13.5px;padding:20px}
.cam-off .ic{font-size:40px;display:block;margin-bottom:10px}
.cam-bar{display:flex;gap:10px;padding:14px;background:rgba(10,14,23,.92);align-items:center;justify-content:center;flex-wrap:wrap}
.gps-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);background:var(--surface2);border:1px solid var(--hairline);border-radius:11px;padding:10px 13px;margin-top:12px}
.gps-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.gps-dot.ok{background:var(--good);box-shadow:0 0 0 4px rgba(12,163,12,.15);animation:pulse 1.8s infinite}
.gps-dot.err{background:var(--crit)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(12,163,12,.18)}50%{box-shadow:0 0 0 7px rgba(12,163,12,.05)}}
.clock{font-size:42px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:16px;color:var(--muted);font-weight:600}
.punch-big{width:100%;padding:17px;border-radius:15px;font-size:16.5px;font-weight:750;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.timeline{margin-top:16px}
.timeline .ti{display:flex;gap:12px;padding:9px 0;align-items:center;border-bottom:1px dashed var(--line)}
.timeline .ti:last-child{border:none}
.ti .tdot{width:11px;height:11px;border-radius:50%;flex:none}
.ti .tt{font-weight:700;font-variant-numeric:tabular-nums}
.ti .ty{font-size:12px;color:var(--muted)}
.ti img{width:34px;height:34px;border-radius:8px;object-fit:cover;margin-left:auto;border:1px solid var(--line)}

/* ---------- CHARTS ---------- */
.chart-card h3, .card h3{font-size:14.5px;margin-bottom:2px}
.chart-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar-tip{position:fixed;pointer-events:none;background:var(--brand);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;box-shadow:var(--shadow-lg);z-index:90;display:none;white-space:pre-line;line-height:1.5}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-size:26px}
.donut-center span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* ---------- MODAL / TOAST ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,23,.55);backdrop-filter:blur(4px);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:26px;animation:rise .25s ease}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:10px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--sab));background:var(--brand);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:95;display:none;max-width:90vw;text-align:center}
.toast.err{background:var(--crit)}
.toast.ok{background:var(--good)}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-view{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 20px;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* payslip print */
#payslipArea{display:none}
@media print{
  body *{visibility:hidden} #payslipArea,#payslipArea *{visibility:visible}
  #payslipArea{display:block;position:absolute;inset:0;padding:30px}
}

/* ---------- MOBILE ---------- */
.bottom-nav{display:none}
@media (max-width: 960px){
  .sidebar{display:none}
  .main{margin-left:0;padding:16px 14px calc(88px + var(--sab))}
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}
  .punch-wrap{grid-template-columns:1fr}
  .topbar h2{font-size:19px}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--brand);padding:8px 6px calc(8px + var(--sab));z-index:40;justify-content:space-around;border-top:1px solid rgba(255,255,255,.08)}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.55);font-size:10px;font-weight:650;padding:5px 9px;border-radius:10px;flex:1;max-width:88px}
  .bottom-nav button svg{width:21px;height:21px}
  .bottom-nav button.active{color:var(--gold)}
}
@media (max-width: 520px){ .g4,.g3,.g2{grid-template-columns:1fr 1fr} .tile .v{font-size:24px} }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo-mark">O</div>
    <h1>OakCraft Attendance</h1>
    <p>Punch in, reports, leave &amp; payroll — all in one place.<br>Sign in with your company Google account.</p>
    <div id="gbtn"></div>
    <div class="login-err" id="loginErr"></div>
    <div class="login-foot">OakCraft · HR &amp; Payroll Automation · Internal Use Only</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
<div class="shell">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="logo-mark">O</div>
      <div><b>OakCraft</b><span>Attendance</span></div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-user">
      <div class="avatar" id="sbAvatar"></div>
      <div style="flex:1;min-width:0">
        <div class="nm" id="sbName"></div>
        <div class="rl" id="sbRole"></div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark / light mode" aria-label="Toggle theme"><svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button><button onclick="logout()" title="Logout">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<div class="bar-tip" id="barTip"></div>
<div id="payslipArea"></div>

<script>
/* ╔══════════════════════════════════════════════════════╗
   ║  CONFIG — FILL IN THESE 2 VALUES (see guide)      ║
   ╚══════════════════════════════════════════════════════╝ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycby13SZVtQyAAykvsFnoKSgvSg3ozQeIGRBQpAJny7D_DhPLKgDU0L57jzHSY5VmfigM/exec',
  GOOGLE_CLIENT_ID: '592952040062-m15ebmndev6aq0u169iu147dd5g5otqf.apps.googleusercontent.com'
};

/* ================= STATE ================= */
let S = { token:null, profile:null, today:null, leaveTypes:[], view:'dashboard', month:new Date().toISOString().slice(0,7), cache:{} };
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INITIALS = n => String(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const MONTH_NAME = m => new Date(m+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const fmtT = t => { if(!t) return '—'; const [h,mi]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; return `${((h+11)%12)+1}:${String(mi).padStart(2,'0')} ${ap}`; };
const fmtD = d => new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const fmtDW = d => new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const INR = n => '₹' + Number(n||0).toLocaleString('en-IN');

/* ================= API ================= */
async function api(action, payload={}, opts={}){
  const res = await fetch(CONFIG.API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action, idToken:S.token, payload })
  });
  const j = await res.json();
  if(!j.ok){
    if(String(j.error).startsWith('AUTH:') && !opts.noRelogin){ ocClearToken(); }
    throw new Error(j.error||'Request failed');
  }
  return j.data;
}

/* ===== THEME (dark / light) ===== */
function applyTheme(t){ if(t==='dark'){ document.documentElement.setAttribute('data-theme','dark'); } else { document.documentElement.removeAttribute('data-theme'); } }
function toggleTheme(){ const cur = document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light'; const next = cur==='dark' ? 'light' : 'dark'; try{ localStorage.setItem('oc_theme', next); }catch(e){} applyTheme(next); }
/* ===== SESSION / TOKEN STORAGE =====
   Regular users stay logged in across browser sessions (localStorage).
   Admin & HR are kept only in sessionStorage, so they must re-login each
   browser session for security. Role is applied once the profile loads. */
var OC_TOK_KEY='oc_tok';
function ocSaveToken(tok, persist){ try{ if(persist){ localStorage.setItem(OC_TOK_KEY,tok); sessionStorage.removeItem(OC_TOK_KEY); } else { sessionStorage.setItem(OC_TOK_KEY,tok); localStorage.removeItem(OC_TOK_KEY); } }catch(e){ try{ sessionStorage.setItem(OC_TOK_KEY,tok); }catch(_e){} } }
function ocGetToken(){ try{ return sessionStorage.getItem(OC_TOK_KEY) || localStorage.getItem(OC_TOK_KEY); }catch(e){ return null; } }
function ocClearToken(){ try{ sessionStorage.removeItem(OC_TOK_KEY); localStorage.removeItem(OC_TOK_KEY); }catch(e){} }
function ocApplyRoleStorage(role){ var priv = ['Admin','HR'].indexOf(role) !== -1; if(S.token){ ocSaveToken(S.token, !priv); } }

async function boot(){
  $('#loginErr').style.display='none';
  $('#gbtn').innerHTML='<div class="spin"></div>';
  try{
    const d = await api('init', {}, {noRelogin:true});
    S.profile=d.profile; S.today=d.today; S.leaveTypes=d.leaveTypes; S.geofence=d.geofence||null; ocApplyRoleStorage(S.profile&&S.profile.role);
    $('#loginScreen').style.display='none';
    $('#app').style.display='block';
    buildNav(); go('dashboard');
  }catch(err){
    $('#loginScreen').style.display='flex';
    if(window.google?.accounts?.id) initGSI();
    $('#loginErr').style.display='block';
    const msg = err.message||'Login failed';
    if(/register nahi|access nahi|not registered|no access/i.test(msg)){
      $('#loginErr').innerHTML = esc(msg) +
        `<div style="margin-top:12px;text-align:left"><input id="reqPhone" placeholder="Phone (optional)" style="margin-bottom:8px">
        <button class="btn btn-gold" style="width:100%" onclick="doRequestAccess(this)">🙋 Request Access — Send to HR</button></div>`;
    } else {
      $('#loginErr').textContent = msg;
    }
  }
}
async function doRequestAccess(btn){
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Sending…';
  try{
    await api('requestAccess', { phone: ($('#reqPhone')?.value||'') }, {noRelogin:true});
    $('#loginErr').innerHTML='✅ Your request has been sent to HR. Once HR adds you, please <b>Sign in</b> again.';
  }catch(e){ btn.disabled=false; btn.innerHTML='Retry'; toast(e.message,'err'); }
}

/* ================= CHARTS (inline SVG) ================= */
const CHART_COLORS = { Present:'var(--good)', Working:'var(--blue)', 'Half Day':'var(--warn)', Absent:'var(--crit)', 'Paid Leave':'var(--violet)', Off:'var(--muted)' };
function tipShow(e, text){ const t=$('#barTip'); t.textContent=text; t.style.display='block'; t.style.left=Math.min(e.clientX+12, innerWidth-170)+'px'; t.style.top=(e.clientY-14)+'px'; }
function tipHide(){ $('#barTip').style.display='none'; }

function hoursBarChart(trend, fullDay){
  // employee ke daily hours — bars, full-day threshold line
  const data = trend.filter(t=>['Present','Working','Half Day','Absent'].includes(t.status)||t.hours>0);
  if(!data.length) return '<div class="empty">No data yet</div>';
  const W=Math.max(320, data.length*26), H=150, pad=6, maxH=Math.max(10, fullDay+2, ...data.map(d=>d.hours));
  const bw=Math.min(16, (W-2*pad)/data.length-6);
  let bars='';
  data.forEach((d,i)=>{
    const x=pad+i*((W-2*pad)/data.length)+3;
    const h=Math.max(2,(d.hours/maxH)*(H-30));
    const col=d.status==='Absent'?'var(--crit)':(d.hours>=fullDay?'var(--good)':'var(--warn)');
    bars+=`<rect x="${x}" y="${H-20-h}" width="${bw}" height="${h}" rx="4" fill="${col}"
      onmousemove="tipShow(event,'${fmtDW(d.date)}\\n${d.hours||0} hrs · ${d.status}${d.late?' · Late':''}')" onmouseleave="tipHide()"/>`;
    if(i%5===0) bars+=`<text x="${x+bw/2}" y="${H-5}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${d.date.slice(8)}</text>`;
  });
  const thY=H-20-(fullDay/maxH)*(H-30);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="none" role="img" aria-label="Daily working hours">
    <line x1="${pad}" y1="${H-20}" x2="${W-pad}" y2="${H-20}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${pad}" y1="${thY}" x2="${W-pad}" y2="${thY}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="${W-pad}" y="${thY-4}" font-size="9.5" text-anchor="end" fill="var(--muted)">${fullDay}h full day</text>
    ${bars}</svg>
    <div class="legend"><span><i style="background:var(--good)"></i>Full day</span><span><i style="background:var(--warn)"></i>Short hours</span><span><i style="background:var(--crit)"></i>Absent</span></div>`;
}

function teamTrendChart(trend){
  if(!trend||!trend.length) return '<div class="empty">No data yet</div>';
  const W=Math.max(340, trend.length*30), H=170, pad=8;
  const maxV=Math.max(1,...trend.map(d=>d.present+d.absent+d.halfDay+d.leave));
  const bw=Math.min(18,(W-2*pad)/trend.length-8);
  const series=[['present','var(--good)','Present'],['halfDay','var(--warn)','Half Day'],['leave','var(--violet)','Leave'],['absent','var(--crit)','Absent']];
  let bars='';
  trend.forEach((d,i)=>{
    const x=pad+i*((W-2*pad)/trend.length)+4;
    let y=H-22;
    const tip=`${fmtDW(d.date)}\\nPresent ${d.present} · Half ${d.halfDay}\\nLeave ${d.leave} · Absent ${d.absent}`;
    series.forEach(([k,col])=>{
      const h=(d[k]/maxV)*(H-38); if(h<=0)return;
      y-=h;
      bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1.5,h-2)}" rx="3" fill="${col}" onmousemove="tipShow(event,'${tip}')" onmouseleave="tipHide()"/>`;
    });
    if(i%4===0) bars+=`<text x="${x+bw/2}" y="${H-6}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${d.date.slice(8)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Team attendance trend">
    <line x1="${pad}" y1="${H-22}" x2="${W-pad}" y2="${H-22}" stroke="var(--line)"/>${bars}</svg>
    <div class="legend">${series.map(([k,c,n])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>`;
}

function donutChart(parts, centerNum, centerLabel){
  const total = parts.reduce((a,p)=>a+p.v,0)||1;
  let acc=0, segs='';
  const R=54, C=2*Math.PI*R;
  parts.filter(p=>p.v>0).forEach(p=>{
    const frac=p.v/total, off=C*(1-acc), len=C*frac;
    segs+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="16"
      stroke-dasharray="${Math.max(0,len-2)} ${C-len+2}" stroke-dashoffset="${off}" stroke-linecap="butt"
      onmousemove="tipShow(event,'${p.n}: ${p.v}')" onmouseleave="tipHide()"/>`;
    acc+=frac;
  });
  return `<div style="position:relative;width:140px;height:140px;flex:none">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px;transform:rotate(-90deg)">
      <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="16"/>${segs}</svg>
    <div class="donut-center"><b>${centerNum}</b><span>${centerLabel}</span></div></div>
    <div class="legend" style="flex-direction:column;gap:8px">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.n} — <b>${p.v}</b></span>`).join('')}</div>`;
}

function haversineM(la1,lo1,la2,lo2){ const R=6371000,r=Math.PI/180,dLa=(la2-la1)*r,dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2; return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function stopCam(){ if(cam.stream){ cam.stream.getTracks().forEach(t=>t.stop()); cam.stream=null; } }

  <div class="topbar"><div><h2>Attendance</h2><div class="sub">${staff?'Selfie + live location ke saath punch (Staff rule)':'Ek button — live location auto-capture (Labour rule)'}</div></div></div>

    <div>
      <div class="card" style="text-align:center">
        <div class="clock" id="liveClock"></div>
        <div style="color:var(--muted);font-size:13px" id="liveDate"></div>
        <div class="gps-row"><span class="gps-dot" id="gpsDot"></span><span id="gpsText">Getting location…</span></div>
        <div class="gps-row" id="geoRow" style="display:none"><span class="gps-dot" id="geoDot"></span><span id="geoText"></span></div>
        <button class="punch-big btn ${nextType==='Punch In'?'btn-good':'btn-danger'}" id="punchBtn" onclick="doPunch()" disabled>
          ${nextType==='Punch In'?'🟢':'🔴'} ${nextType}</button>
        <div style="font-size:12px;color:var(--muted);margin-top:10px" id="punchHint">${staff?'First take a selfie and let GPS lock':'Let GPS lock…'}</div>
      </div>
      <div class="card" style="margin-top:16px"><h3>Aaj ke punches</h3>
        <div class="timeline" id="todayPunches">${renderPunchList(t.punches||[])}</div></div>
    </div>
  </div>`;
  tickClock(); if(window._clk) clearInterval(window._clk); window._clk=setInterval(tickClock,1000);

}
function renderPunchList(punches){
  if(!punches.length) return '<div class="empty" style="padding:20px">No punches today yet</div>';
  return punches.map(p=>`<div class="ti"><span class="tdot" style="background:${p.type==='Punch In'?'var(--good)':'var(--crit)'}"></span>
    <div><div class="tt">${fmtT(p.time)}</div><div class="ty">${esc(p.type)}</div></div>
    ${p.photo?`<img src="${esc(p.photo)}" alt="" loading="lazy">`:''}</div>`).join('');
}
function tickClock(){ const n=new Date(); const el=$('#liveClock'); if(!el){clearInterval(window._clk);return;}
  el.innerHTML=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+`<small> ${n.toLocaleTimeString('en-IN',{second:'2-digit'}).padStart(2,'0')}s</small>`;
  $('#liveDate').textContent=n.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}); }
async function startCam(){
  try{
    cam.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720}},audio:false});
    $('#camVideo').srcObject=cam.stream; $('#camVideo').style.display='block';
    $('#camOff').style.display='none'; $('#camStartBtn').style.display='none'; $('#camSnapBtn').style.display='inline-flex';
  }catch(e){ toast('Camera access denied — please allow browser permission','err'); }
}
function snap(){
  const v=$('#camVideo'), c=$('#camCanvas');
  const w=Math.min(640, v.videoWidth), h=Math.round(w*v.videoHeight/v.videoWidth);
  c.width=w; c.height=h;
  c.getContext('2d').drawImage(v,0,0,w,h);
  cam.photo = c.toDataURL('image/jpeg', 0.72);
  c.style.display='block'; v.style.display='none'; stopCam();
  $('#camSnapBtn').style.display='none'; $('#camRetakeBtn').style.display='inline-flex';
  checkReady();
}
function retake(){ cam.photo=null; $('#camCanvas').style.display='none'; $('#camRetakeBtn').style.display='none'; $('#camStartBtn').style.display='none'; startCam(); $('#camSnapBtn').style.display='inline-flex'; checkReady(); }
function getGPS(){
  if(!navigator.geolocation){ $('#gpsText').textContent='GPS is not supported in this browser'; $('#gpsDot').className='gps-dot err'; return; }
  navigator.geolocation.getCurrentPosition(p=>{
    cam.pos={lat:p.coords.latitude, lng:p.coords.longitude, accuracy:Math.round(p.coords.accuracy)};
    const d=$('#gpsDot'), tx=$('#gpsText'); if(!d)return;
    d.className='gps-dot ok';
    tx.innerHTML=`Location locked <b>±${cam.pos.accuracy}m</b> · <a href="https://maps.google.com/?q=${cam.pos.lat},${cam.pos.lng}" target="_blank" style="color:var(--blue)">map</a>`;
    // office geo-fence indicator (live distance)
    const g=S.geofence;
    if(g && g.radius>0 && g.lat && g.lng){
      const dist=Math.round(haversineM(cam.pos.lat,cam.pos.lng,Number(g.lat),Number(g.lng)));
      const inside=dist<=Number(g.radius);
      cam.inside=inside;
      const row=$('#geoRow'); if(row){ row.style.display='flex';
        $('#geoDot').className='gps-dot '+(inside?'ok':'err');
        $('#geoText').innerHTML= inside
          ? `🏢 You are <b>inside</b> the office zone (${dist}m / ${g.radius}m allowed) ✅`
          : `⛔ You are <b>${dist>=1000?(dist/1000).toFixed(1)+' km':dist+'m'}</b> away from office — you can only punch within ${g.radius}m`; }
    } else cam.inside=true;
    checkReady();
  }, err=>{ const d=$('#gpsDot'); if(!d)return; d.className='gps-dot err'; $('#gpsText').textContent='Location unavailable — enable GPS/permission and refresh the page'; },
  {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
}
function checkReady(){
  const photoOk = !needPhoto() || !!cam.photo;
  const zoneOk = cam.inside !== false;
  const ok = photoOk && cam.pos && zoneOk;
  const b=$('#punchBtn'); if(!b) return;
  b.disabled=!ok;
  $('#punchHint').textContent = ok ? 'All set — tap to punch ✅'
    : !cam.pos ? 'GPS lock hone do'
    : !zoneOk ? 'Reach the office location to punch'
    : 'Selfie still required';
}
async function doPunch(){
  const b=$('#punchBtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> Saving…';
  try{
    const r = await api('punch', {photoBase64:cam.photo, lat:cam.pos.lat, lng:cam.pos.lng, accuracy:cam.pos.accuracy, device:navigator.userAgent.slice(0,110)});
    toast(`✅ ${r.type} saved — ${fmtT(r.time)}`, 'ok');
    const d = await api('init'); S.today=d.today; cam.photo=null;
    renderPunch();
  }catch(e){ toast(e.message,'err'); b.disabled=false; b.innerHTML='Punch'; }
}

/* ================= CALENDAR VIEW ================= */
const CAL_BG = { 'Present':'var(--good)','Working':'var(--blue)','Half Day':'var(--warn)','Absent':'var(--crit)','Paid Leave':'var(--violet)','Week Off':'var(--muted)','Holiday':'var(--muted)','Festival Holiday':'var(--aqua)' };
function calendarView(rows, month){
  // monthly calendar grid for one employee
  const [y,m]=month.split('-').map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const firstDow=new Date(y,m-1,1).getDay();
  const byDate={}; rows.forEach(r=>byDate[r.date]=r);
  const today=new Date().toISOString().slice(0,10);
  let cells='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells+=`<div style="text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0">${d}</div>`);
  for(let i=0;i<firstDow;i++) cells+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=month+'-'+String(d).padStart(2,'0');
    const r=byDate[ds];
    const col=r?CAL_BG[r.status]:'transparent';
    const future=ds>today;
    const tip=r?`${fmtDW(ds)}\\n${r.status}${r.late?' · Late':''}${r.punchIn?'\\nIn '+fmtT(r.punchIn):''}${r.punchOut?' · Out '+fmtT(r.punchOut):''}${r.hoursText?'\\n'+r.hoursText:''}`:fmtDW(ds);
    cells+=`<div onmousemove="tipShow(event,'${tip}')" onmouseleave="tipHide()" style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      background:${r?'color-mix(in srgb,'+col+' 14%, var(--surface))':'var(--surface2)'};border:1.5px solid ${ds===today?'var(--gold)':r?'color-mix(in srgb,'+col+' 35%, transparent)':'var(--hairline)'};${future?'opacity:.35':''}">
      <span style="font-size:12.5px;font-weight:700">${d}</span>
      ${r?`<span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>`:''}
      ${r&&r.late?'<span style="font-size:8px;color:var(--serious);font-weight:800">LATE</span>':''}</div>`;
  }
  const legend=Object.entries({Present:'var(--good)','Half Day':'var(--warn)',Absent:'var(--crit)','Paid Leave':'var(--violet)','Week Off / Holiday':'var(--muted)'})
    .map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('');
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${cells}</div><div class="legend">${legend}</div>`;
}

var IMP_ROWS = [];
var IMP_COLS = ['Employee Name','Useremail','Employee Code','Timing','Employee Type','Status','Role','Department','Designation','Basic Salary','Week Off Day'];
function impNorm(s){ var o=''; s=String(s).toLowerCase(); for(var i=0;i<s.length;i++){ var c=s.charCodeAt(i); if(c>=97&&c<=122) o+=s.charAt(i); } return o; }
function impPick(obj, keys){ for(var k in obj){ if(keys.indexOf(impNorm(k))>=0){ var val=obj[k]; if(val===null||val===undefined) return ''; return String(val).trim(); } } return ''; }
function impMap(o){
  return {
    name: impPick(o,['employeename','name','fullname','empname']),
    email: impPick(o,['useremail','email','emailid','mail','gmail']).toLowerCase(),
    code: impPick(o,['employeecode','code','empcode','empid','employeeid']),
    timing: impPick(o,['timing','shift','shifttiming','intime']) || '09:30',
    type: impPick(o,['employeetype','type']) || 'Staff',
    status: impPick(o,['status']) || 'Active',
    role: impPick(o,['role']) || 'Employee',
    department: impPick(o,['department','dept']),
    designation: impPick(o,['designation','title','post']),
    basicSalary: impPick(o,['basicsalary','salary','basic','ctc']) || '0',
    weekOffDay: impPick(o,['weekoffday','weekoff','offday','off']) || 'Sunday'
  };
}
function impValid(r){
  var e=[];
  if(!r.name) e.push('Name missing');
  var at=r.email.indexOf('@');
  if(at<1 || r.email.indexOf('.',at) < at+2) e.push('Email invalid');
  return e;
}
function importModal(){
  IMP_ROWS=[];

   +'<p class="msub">Excel (.xlsx / .xls) ya CSV file upload karein. Pehli row me column headers honi chahiye. Employee Code khaali chhod dein to automatically next code lag jayega.</p>'
   +'<div style="font-size:12px;color:var(--muted);line-height:1.7;background:var(--surface2);border:1px solid var(--hairline);border-radius:10px;padding:10px 12px"><b>Columns:</b> '+IMP_COLS.join(' &middot; ')+'<br><a href="#" onclick="impTemplate();return false" style="color:var(--blue);font-weight:600">Sample CSV template download karein</a></div>'
   +'<label>Choose file</label><input type="file" id="impFile" accept=".xlsx,.xls,.csv" onchange="impRead(this)">'
   +'<div id="impPrev" style="margin-top:14px"></div>'
   +'<div class="modal-foot"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-gold" id="impGo" disabled onclick="impRun()">Import</button></div>');

function impTemplate(){
  var nl=String.fromCharCode(10);
  var csv=IMP_COLS.join(',')+nl+'Ravi Kumar,ravi@oakcraft.in,OC010,09:30,Staff,Active,Employee,Sales,Executive,20000,Sunday'+nl;
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='employee_import_template.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function impLib(){
  return new Promise(function(res,rej){
    if(window.XLSX) return res();
    var s=document.createElement('script');
    s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload=function(){ res(); };
    s.onerror=function(){ rej(new Error('Excel library load nahi ho payi. Internet check karein ya CSV file use karein.')); };
    document.head.appendChild(s);
  });
}
async function impRead(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var prev=$('#impPrev'); prev.innerHTML='<span class="msub">Reading file...</span>';
  try{
    await impLib();
    var buf=await f.arrayBuffer();
    var wb=XLSX.read(buf,{type:'array'});
    var raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
    IMP_ROWS=raw.map(impMap).filter(function(r){ return r.name||r.email||r.code; });
    impPreview();
  }catch(err){ prev.innerHTML='<span style="color:var(--crit)">'+esc(err.message)+'</span>'; }
}
function impPreview(){
  var prev=$('#impPrev'), go=$('#impGo');
  if(!IMP_ROWS.length){ prev.innerHTML='<span style="color:var(--crit)">File me koi row nahi mili.</span>'; go.disabled=true; return; }
  var existing=((S.cache&&S.cache.users)||[]).map(function(u){ return Object.keys(u).map(function(k){ return String(u[k]); }).join('|').toLowerCase(); });
  ocAssignCodes(IMP_ROWS);
  var seen=[], ok=0, bad=0;
  var html='<div class="tbl-wrap" style="max-height:240px;overflow:auto"><table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Code</th><th>Status</th></tr></thead><tbody>';
  IMP_ROWS.forEach(function(r,i){
    var e=impValid(r);
    if(r.email && seen.indexOf(r.email)>=0) e.push('File me duplicate');
    seen.push(r.email);
    var dup = r.email && existing.some(function(s){ return s.indexOf(r.email)>=0; });
    if(e.length){ bad++; } else { ok++; }
    var st = e.length ? '<span class="chip c-absent">'+esc(e.join(', '))+'</span>' : (dup ? '<span class="chip c-late">Update hoga</span>' : '<span class="chip c-present">Naya</span>');
    html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.code)+(r.autoCode?' <span class="msub" style="font-size:11px">(auto)</span>':'')+'</td><td>'+st+'</td></tr>';
  });
  html+='</tbody></table></div><p class="msub" style="margin-top:8px">'+ok+' valid row(s) import hongi, '+bad+' skip.</p>';
  prev.innerHTML=html;
  go.disabled = (ok===0);
}
async function impRun(){
  var go=$('#impGo'); go.disabled=true;
  var list=IMP_ROWS.filter(function(r){ return impValid(r).length===0; });
  var done=0, fails=[];
  for(var i=0;i<list.length;i++){
    go.textContent='Importing '+(i+1)+' / '+list.length+'...';
    try{ await api('saveUser', list[i]); done++; }
    catch(err){ fails.push(list[i].email+' - '+err.message); }
  }
  closeModal();
  toast(done+' employee(s) import ho gaye'+(fails.length?', '+fails.length+' fail':''), fails.length?'':'ok');
  await renderUsers();
  if(fails.length){
    modal('<h3>Import Report</h3><p class="msub">'+done+' successful, '+fails.length+' failed</p><div style="font-size:12.5px;line-height:1.8;color:var(--crit)">'+fails.map(esc).join('<br>')+'</div><div class="modal-foot"><button class="btn btn-o" onclick="closeModal()">Close</button></div>');
  }
}

var OC_READS = ['init','getDashboard','getReports','getMyAttendance','getLeaves','getUsers','getPayout','getSettings','getHolidays','getRawAttendance','getAudit','getAccessRequests'];
var OC_NORERENDER = ['init'];
var OC_INFLIGHT = {};
var OC_RERENDERED = {};
function ocKey(a,p){ try{ return 'occ:'+a+':'+JSON.stringify(p||{}); }catch(e){ return 'occ:'+a; } }
function ocGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function ocSet(k,d){ try{ localStorage.setItem(k, JSON.stringify({t:Date.now(), d:d})); }catch(e){ ocTrim(); } }
function ocTrim(){ try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('occ:')===0) localStorage.removeItem(k); }); }catch(e){} }
function ocAge(t){
  var m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'abhi ka';
  if(m<60) return m+' min purana';
  var h=Math.round(m/60); if(h<24) return h+' ghante purana';
  return Math.round(h/24)+' din purana';
}
function ocBanner(show,msg){
  var el=document.getElementById('ocOffBar');
  if(!el){
    el=document.createElement('div'); el.id='ocOffBar';
    el.style.cssText='position:fixed;left:0;right:0;top:0;z-index:300;background:#eda100;color:#151a26;font-size:12.5px;font-weight:700;text-align:center;padding:6px 10px;display:none';
    document.body.appendChild(el);
  }
  if(msg) el.textContent=msg;
  el.style.display = show ? 'block' : 'none';
}
function ocRerender(){
  try{ if(typeof go==='function' && typeof S==='object' && S && S.view) go(S.view); }catch(e){}
}
(function(){
  if(typeof api!=='function') return;
  var ORIG = api;
  window.api = function(action, payload, opts){
    var isRead = OC_READS.indexOf(action) >= 0;
    var offline = (navigator.onLine === false);
    if(!isRead){
      if(offline) return Promise.reject(new Error('Aap offline hain. Ye action internet ke bina nahi ho sakta.'));
      return ORIG(action, payload, opts);
    }
    var key = ocKey(action, payload);
    var cached = ocGet(key);
    if(offline){
      if(cached){ ocBanner(true, 'Offline - ' + ocAge(cached.t) + ' data dikha rahe hain'); return Promise.resolve(cached.d); }
      return Promise.reject(new Error('Aap offline hain aur is screen ka saved data maujood nahi hai.'));
    }
    var net = OC_INFLIGHT[key];
    if(!net){
      net = ORIG(action, payload, opts).then(function(d){
        delete OC_INFLIGHT[key];
        var changed = !cached || JSON.stringify(cached.d) !== JSON.stringify(d);
        ocSet(key, d);
        ocBanner(false);
        if(cached && changed && !OC_RERENDERED[key] && OC_NORERENDER.indexOf(action) < 0){
          OC_RERENDERED[key] = 1;
          setTimeout(ocRerender, 0);
        }
        return d;
      }, function(err){ delete OC_INFLIGHT[key]; throw err; });
      OC_INFLIGHT[key] = net;
    }
    if(cached){
      net.catch(function(){ ocBanner(true, 'Server se connect nahi ho pa raha - ' + ocAge(cached.t) + ' data dikha rahe hain'); });
      return Promise.resolve(cached.d);
    }
    return net;
  };
})();
window.addEventListener('online', function(){ ocBanner(false); ocRerender(); });
window.addEventListener('offline', function(){ ocBanner(true, 'Aap offline hain - saved data dikh raha hai'); });
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}


/* ============ AUTO EMPLOYEE CODE ============ */
function ocPad(n,len){ var s=String(n); while(s.length<len){ s='0'+s; } return s; }
function ocParseCode(v){
  v = String(v==null?'':v).trim();
  if(v.length<2 || v.length>14) return null;
  var i=0;
  while(i<v.length){ var c=v.charCodeAt(i); if(c>=48 && c<=57) break; i++; }
  if(i===0 || i===v.length) return null;
  var p=v.slice(0,i), d=v.slice(i);
  var pu=p.toUpperCase();
  for(var k=0;k<pu.length;k++){ var a=pu.charCodeAt(k); if(a<65 || a>90) return null; }
  for(var j=0;j<d.length;j++){ var b=d.charCodeAt(j); if(b<48 || b>57) return null; }
  return { p:pu, n:parseInt(d,10), pad:d.length };
}
function ocUserCode(u){
  var val='';
  Object.keys(u).forEach(function(k){ if(!val && String(k).toLowerCase().indexOf('code')>=0){ val=String(u[k]==null?'':u[k]).trim(); } });
  return val;
}
function ocCodeInfo(){
  var users = (typeof S==='object' && S && S.cache && S.cache.users) ? S.cache.users : [];
  var best=null, used={};
  users.forEach(function(u){
    var val=ocUserCode(u);
    var m=ocParseCode(val);
    if(m){ used[val.toUpperCase()]=1; if(!best || m.n>best.n) best=m; }
  });
  if(!best) best={ p:'OC', n:0, pad:3 };
  return { prefix:best.p, pad:best.pad, max:best.n, used:used };
}
function ocNextCode(extraUsed){
  var info=ocCodeInfo();
  var used=info.used;
  if(extraUsed){ extraUsed.forEach(function(c){ if(c) used[String(c).toUpperCase()]=1; }); }
  var n=info.max+1;
  var code=info.prefix+ocPad(n,info.pad);
  var guard=0;
  while(used[code.toUpperCase()] && guard<5000){ n++; code=info.prefix+ocPad(n,info.pad); guard++; }
  return code;
}
function ocAssignCodes(rows){
  var used=[];
  rows.forEach(function(r){ if(r.code) used.push(r.code); });
  rows.forEach(function(r){
    if(!r.code){ var c=ocNextCode(used); r.code=c; r.autoCode=true; used.push(c); }
  });
}
(function(){
  if(typeof userModal!=='function') return;
  var OM=userModal;
  window.userModal=function(){
    var out=OM.apply(null, arguments);
    try{
      var el=document.getElementById('uCode');
      if(el && !String(el.value||'').trim()){
        el.value=ocNextCode();
        el.title='Auto-generated code - zaroorat ho to badal sakte hain';
      }
    }catch(e){}
    return out;
  };
})();

(function(){
  var st=document.createElement('style');
  st.textContent='@keyframes ocShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}.oc-shake{animation:ocShake .3s ease}';
  document.head.appendChild(st);
  document.addEventListener('click', function(e){
    var bg=document.getElementById('modalBg');
    if(!bg || e.target!==bg) return;
    e.stopPropagation();
    e.preventDefault();
    var box=document.getElementById('modalBox');
    if(box){ box.classList.remove('oc-shake'); void box.offsetWidth; box.classList.add('oc-shake'); }
  }, true);
})();
