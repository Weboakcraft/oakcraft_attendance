name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (blank = 1.0.<run number>)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK with its licences accepted.
      # android-actions/setup-android@v3 used to work, but it now replaces those
      # command-line tools with a newer build whose licence prompt is never answered,
      # so the step dies on "6 of 7 SDK package licenses not accepted". Using the
      # sdkmanager that is already on the runner avoids the whole problem.
      - name: Set up the Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          [ -x "$SDKMANAGER" ] || { echo "No sdkmanager on this runner."; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Work out the build settings
        id: cfg
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          echo "origin=https://$OWNER.github.io"  >> "$GITHUB_OUTPUT"
          echo "path=/$REPO/"                     >> "$GITHUB_OUTPUT"
          echo "apk_url=https://github.com/${{ github.repository }}/releases/download/latest/ATTENDANCE.apk" >> "$GITHUB_OUTPUT"
          NAME="${{ github.event.inputs.version_name }}"
          [ -n "$NAME" ] || NAME="1.0.${{ github.run_number }}"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "The app will open https://$OWNER.github.io/$REPO/"

      - name: Find the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/ci.jks
            echo "keystore=$GITHUB_WORKSPACE/android/keystore/ci.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key — building a TEST apk. A Trusted Web Activity only drops its address bar when it is signed with the key listed in assetlinks.json."
          fi

      - name: Build
        working-directory: android
        env:
          OAK_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          OAK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OAK_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'oakcraft' }}
          OAK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew --no-daemon --stacktrace "$TASK" \
            "-PoakSiteOrigin=${{ steps.cfg.outputs.origin }}" \
            "-PoakSitePath=${{ steps.cfg.outputs.path }}" \
            "-PoakVersionName=${{ steps.cfg.outputs.version_name }}" \
            "-PoakVersionCode=${{ github.run_number }}" \
            "-PoakApkUrl=${{ steps.cfg.outputs.apk_url }}"

      - name: Collect the APK
        id: out
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          [ -n "$APK" ] || { echo "No APK was produced."; exit 1; }
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp "$APK" ATTENDANCE.apk; echo "name=ATTENDANCE.apk" >> "$GITHUB_OUTPUT"
          else
            cp "$APK" ATTENDANCE-TESTING.apk; echo "name=ATTENDANCE-TESTING.apk" >> "$GITHUB_OUTPUT"
          fi
          ls -lh ATTENDANCE*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ATTENDANCE-apk
          path: ${{ steps.out.outputs.name }}
          retention-days: 60

      - name: Keep a "latest" release with the APK in it
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "ATTENDANCE — latest APK" \
              --notes "Built automatically from the newest commit. Copy the .apk to the phone and open it." --latest
          gh release upload latest ATTENDANCE.apk --clobber
          # The app reads "apk-version-code" from these notes to decide whether to
          # show its Update button - so update them only after the APK is uploaded.
          printf '%s\n' \
            "Built automatically from the newest commit. Copy the .apk to the phone and open it," \
            "or tap **Update** inside the app." \
            "" \
            "Version ${{ steps.cfg.outputs.version_name }}" \
            "" \
            "apk-version-code: ${{ github.run_number }}" > notes.md
          gh release edit latest --title "ATTENDANCE — latest APK" --notes-file notes.md

      - name: Summary
        run: |
          {
            echo "### ATTENDANCE APK"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${{ steps.out.outputs.name }}\` |"
            echo "| Version | ${{ steps.cfg.outputs.version_name }} (code ${{ github.run_number }}) |"
            echo "| Opens | ${{ steps.cfg.outputs.origin }}${{ steps.cfg.outputs.path }} |"
            echo "| Signed with your key | ${{ steps.signing.outputs.signed }} |"
            echo
            echo "This is a Trusted Web Activity. It only runs without an address bar once"
            echo "\`${{ steps.cfg.outputs.origin }}/.well-known/assetlinks.json\` is live and lists this app's"
            echo "signing fingerprint. Until then it still works, just inside a Chrome tab."
          } >> "$GITHUB_STEP_SUMMARY"
